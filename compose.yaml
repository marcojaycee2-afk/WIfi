services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://napbox:napbox-local@db:5432/napbox
      HOST: 0.0.0.0
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      PORT: 3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-telecomadmin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      NOTIFICATION_CRON: ${NOTIFICATION_CRON:-0 8 * * *}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Manila}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: napbox
      POSTGRES_USER: napbox
      POSTGRES_PASSWORD: napbox-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U napbox -d napbox"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: