<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>ISP Manager</title>

<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<style>
:root{
  --bg:#0b1220;
  --bg-2:#0f172a;
  --surface:#141d31;
  --surface-2:#1a2438;
  --surface-3:#22304a;
  --ink:#e8edf7;
  --ink-2:#c5d0e4;
  --muted:#8896b0;
  --line:#26324a;
  --line-2:#334560;
  --accent:#3b82f6;
  --accent-hover:#2563eb;
  --accent-soft:#1e3a8a;
  --green:#22c55e;
  --green-soft:#14532d;
  --amber:#f59e0b;
  --amber-soft:#78350f;
  --orange:#f97316;
  --orange-soft:#7c2d12;
  --red:#ef4444;
  --red-soft:#7f1d1d;
  --blue-soft:#1e3a8a;
  --radius:14px;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
  min-height:100vh;
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:17px}
h3{font-size:14px}

.topbar{
  position:sticky;top:0;z-index:60;background:var(--bg-2);color:#fff;
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  padding-top:calc(12px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line);
}
.brand{font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.6}
.save-status{font-size:11px;color:var(--muted);white-space:nowrap}
.save-status[data-state="saving"]{color:var(--amber)}
.save-status[data-state="warning"]{color:var(--amber)}
.save-status[data-state="error"]{color:#fca5a5}
.topbar .btn{background:rgba(255,255,255,.08);border-color:transparent;color:var(--ink);font-size:12px;padding:7px 11px}
.topbar .btn:hover{background:rgba(255,255,255,.15)}
#btnMenu{display:none}

.tabs{
  position:sticky;top:calc(57px + env(safe-area-inset-top));z-index:55;
  display:flex;gap:8px;overflow-x:auto;padding:10px 12px;
  background:var(--bg);border-bottom:1px solid var(--line);
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  padding:7px 13px;border-radius:999px;font-size:13px;font-weight:550;cursor:pointer;
  white-space:nowrap;transition:.15s;
}
.tab:hover{border-color:var(--line-2);color:var(--ink-2)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.mobile-menu-action{display:none}

main{padding:14px;max-width:1180px;margin:0 auto}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.page-head h1{font-size:20px;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.right{text-align:right}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  padding:8px 14px;border-radius:10px;font-size:13px;font-weight:550;
  cursor:pointer;transition:.15s;font-family:inherit;
}
.btn:hover{background:var(--surface-3);border-color:var(--line-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{background:transparent;border-color:#7f1d1d;color:#fca5a5}
.btn.danger:hover{background:#450a0a}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.block{width:100%}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:max-content}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--muted);font-weight:650;padding:8px 10px;border-bottom:2px solid var(--line);
  white-space:nowrap;background:var(--surface);position:sticky;top:0;
}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;color:var(--ink-2)}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody tr.due-unpaid td{color:#fca5a5}
tbody tr.due-unpaid:hover{background:rgba(239,68,68,.08)}
tbody tr:last-child td{border-bottom:none}
td.wrap,th.wrap{white-space:normal;min-width:140px}
td strong{color:var(--ink)}
.row-actions{display:flex;gap:6px}

.badge{
  display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:650;
  white-space:nowrap;line-height:1.6;
}
.b-green{background:var(--green-soft);color:#86efac}
.b-amber{background:var(--amber-soft);color:#fcd34d}
.b-orange{background:var(--orange-soft);color:#fdba74}
.b-red{background:var(--red-soft);color:#fca5a5}
.b-gray{background:var(--surface-3);color:var(--ink-2)}
.b-blue{background:var(--blue-soft);color:#93c5fd}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650}
.kpi .val{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.02em;color:var(--ink)}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:2px}

.bar{height:8px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.bar.ok>span{background:var(--green)}
.bar.warn>span{background:var(--amber)}
.bar.full>span{background:var(--red)}

.ports{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;margin-top:10px}
.port{
  border:1px solid var(--line);border-radius:9px;padding:7px 4px;text-align:center;
  font-size:10px;font-weight:600;background:var(--surface-2);cursor:pointer;
}
.port .n{display:block;font-size:13px;font-weight:700;margin-bottom:2px}
.port.used{background:var(--blue-soft);border-color:#1e40af;color:#93c5fd}
.port.free{background:var(--surface-3);color:var(--muted)}
.port.faulty{background:var(--red-soft);border-color:#991b1b;color:#fca5a5}
.port.reserved{background:var(--amber-soft);border-color:#92400e;color:#fcd34d}

.field{display:block;margin-bottom:11px}
.field>span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field-hint{display:block;margin-top:4px;color:var(--muted);font-size:11px}
.tag-editor{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:44px;padding:5px 7px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.tag-editor:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
.tag-chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:4px 7px 4px 9px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface-3);color:var(--ink);font-size:12px}
.tag-chip span{overflow-wrap:anywhere}
.tag-remove{border:0;background:transparent;color:var(--muted);font:inherit;font-size:16px;line-height:1;cursor:pointer;padding:0 2px}
.tag-remove:hover{color:#fca5a5}
.tag-editor input{flex:1 1 110px;width:auto;min-width:100px;padding:6px;border:0;background:transparent;font-size:14px;box-shadow:none}
.tag-editor input:focus{border:0;box-shadow:none}
.tag-add{flex:0 0 32px;width:32px;height:32px;padding:0;border-radius:8px}
input,select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;
  font-size:15px;font-family:inherit;background:var(--surface-2);color:var(--ink);outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
textarea{resize:vertical}
input[type=search]{font-size:14px}
input[type=color]{padding:3px;height:42px;cursor:pointer}
select option{background:var(--surface-2);color:var(--ink)}

.backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
  display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);
}
.backdrop.open{display:flex}
.modal{
  background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:18px;border:1px solid var(--line);
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
  animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media(min-width:640px){
  .backdrop{align-items:center}
  .modal{border-radius:18px;max-height:88vh}
}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-head h2{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1}

#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:var(--surface-3);color:var(--ink);padding:11px 18px;border-radius:999px;
  font-size:13px;font-weight:550;opacity:0;pointer-events:none;transition:.25s;z-index:200;
  box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90vw;text-align:center;
  border:1px solid var(--line-2);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

.empty{text-align:center;padding:34px 14px;color:var(--muted)}
.empty .big{font-size:32px;margin-bottom:8px;opacity:.5}
.searchbar{display:flex;gap:8px;margin-bottom:12px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.note{background:var(--surface-2);border-left:3px solid var(--accent);padding:10px 12px;border-radius:8px;font-size:12px;color:var(--muted)}
.splitter-choice-group{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 11px;padding:0;border:0}
.splitter-choice{
  position:relative;display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface-2);color:var(--ink-2);font-weight:650;cursor:pointer;
}
.splitter-choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:#fff;box-shadow:0 0 0 1px var(--accent)}
.splitter-choice input{
  appearance:none;width:16px;height:16px;flex:0 0 16px;margin:0;
  display:grid;place-content:center;border:1px solid var(--muted);border-radius:4px;
  background:var(--bg-2);
}
.splitter-choice input:checked{border-color:var(--accent);background:var(--accent)}
.splitter-choice input:checked:after{content:"✓";color:#fff;font-size:12px;font-weight:800;line-height:1}
.splitter-choice input:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
@media(max-width:520px){.splitter-choice-group{grid-template-columns:repeat(2,minmax(0,1fr))}}

.subtabs{
  display:inline-flex;gap:4px;background:var(--surface-3);border-radius:12px;padding:4px;margin-bottom:12px;
}
.subtab{
  border:none;background:transparent;color:var(--muted);
  padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;white-space:nowrap;
}
.subtab.active{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(59,130,246,.4)}

#mapWrap{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
#map{height:min(65vh, 560px);width:100%;z-index:0;background:#0f172a}
.map-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.map-bar #mapSearchInput{flex:1 1 260px;min-width:min(100%,220px);width:auto}
.map-cross{
  position:absolute;left:50%;top:50%;z-index:480;pointer-events:none;
  transform:translate(-50%,-100%);font-size:36px;
  filter:drop-shadow(0 2px 3px #000)
}
.map-confirm{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  z-index:520;display:flex;gap:8px
}
.map-confirm[hidden],.map-cross[hidden]{display:none}
.map-status{
  position:absolute;z-index:450;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(420px,calc(100% - 32px));padding:14px 16px;border:1px solid var(--line-2);
  border-radius:12px;background:rgba(15,23,42,.96);color:var(--ink-2);
  box-shadow:var(--shadow);text-align:center;font-size:13px;
}
.map-status[hidden]{display:none}
.map-status strong{display:block;margin-bottom:4px;color:var(--ink)}
.map-overlay{
  position:absolute;left:10px;bottom:10px;z-index:500;
  background:rgba(15,23,42,.9);backdrop-filter:blur(4px);
  padding:9px 11px;border-radius:10px;border:1px solid var(--line-2);
  font-size:11px;color:var(--ink-2);box-shadow:0 3px 10px rgba(0,0,0,.4);
  max-width:220px;
}
.map-overlay b{color:var(--ink);display:block;margin-bottom:4px;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.map-overlay .row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.map-help{
  position:absolute;right:10px;top:10px;z-index:500;
  background:rgba(15,23,42,.9);backdrop-filter:blur(4px);
  padding:8px 11px;border-radius:10px;border:1px solid var(--line-2);
  font-size:11px;color:var(--ink-2);box-shadow:0 3px 10px rgba(0,0,0,.4);
  max-width:200px;line-height:1.5;
}
.map-context-menu{
  position:absolute;z-index:600;display:grid;gap:6px;min-width:180px;
  padding:8px;border:1px solid var(--line-2);border-radius:10px;
  background:rgba(15,23,42,.97);box-shadow:0 8px 24px rgba(0,0,0,.45);
}
.map-context-menu[hidden]{display:none}
.map-context-menu .btn{justify-content:flex-start}
.map-link{
  padding:0;border:0;background:none;color:var(--accent);font:inherit;
  text-decoration:underline;cursor:pointer;
}
.map-link:hover{background:none;color:#93c5fd}
.napbox-map-marker{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  width:52px;min-height:58px;cursor:pointer;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.65));
  transition:transform .15s;
}
.napbox-map-marker:hover{transform:scale(1.12)}
.napbox-map-icon{display:block;width:42px;height:42px}
.napbox-map-icon svg{display:block;width:100%;height:100%}
.napbox-map-label{
  max-width:100%;padding:1px 4px;border:1px solid #fff;border-radius:6px;
  background:#1e293b;color:#fff;font-size:9px;font-weight:750;
  line-height:1.25;text-align:center;white-space:nowrap;
}
.home-marker{
  width:34px;height:34px;border-radius:6px;
  background:#334155;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;
  box-shadow:0 4px 10px rgba(0,0,0,.5);
}
.client-house-marker{
  width:32px;height:32px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  background:#f59e0b;border:2px solid #fff;color:#111827;
  font-size:17px;box-shadow:0 3px 9px rgba(0,0,0,.45);
}
.mapboxgl-popup-content{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:8px}
.mapboxgl-popup-content b{color:var(--ink)}
.mapboxgl-popup-close-button{color:var(--muted);font-size:18px}
.mapboxgl-popup-tip{border-top-color:var(--surface)!important;border-bottom-color:var(--surface)!important}
.mapboxgl-ctrl-group button{background-color:var(--surface-3)!important}
.mapboxgl-ctrl-group button span{filter:invert(1)}
.mapboxgl-ctrl-attrib{font-size:10px}

/* ---------- NAP BOX / SPLITTER PANEL ---------- */
.splitter-wrap{
  padding:12px 0 24px;
}
.napbox{
  --box-black:#090d13;
  --box-black-2:#101722;
  --box-edge:#273244;
  --box-edge-2:#3a4658;
  --metal:#b9c3cd;
  --metal-dark:#697584;
  --blue-1:#1e9bff;
  --blue-2:#006bd6;
  position:relative;
  max-width:1060px;
  margin:0 auto;
  padding:26px 24px 22px;
  border-radius:22px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.045),transparent 32%),
    linear-gradient(180deg,#151e2b 0%,#0a0e14 100%);
  border:2px solid #2f3a4b;
  box-shadow:
    0 28px 60px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 0 0 1px rgba(0,0,0,.45);
  overflow:hidden;
}
.napbox:before{
  content:"";
  position:absolute;
  inset:10px;
  pointer-events:none;
  border:1px solid rgba(255,255,255,.055);
  border-radius:16px;
}
.napbox-lid{
  position:absolute;
  top:22px;
  right:-64px;
  width:120px;
  height:230px;
  border:2px solid #273244;
  border-left:0;
  border-radius:0 18px 18px 0;
  background:linear-gradient(180deg,#141d29,#080c12);
  box-shadow:18px 18px 30px rgba(0,0,0,.35);
  transform:skewY(-1deg);
  opacity:.9;
}
.napbox-lid:after{
  content:"NAP BOX";
  position:absolute;
  left:22px;
  top:50%;
  transform:translateY(-50%) rotate(90deg);
  color:#66758a;
  font-size:10px;
  font-weight:800;
  letter-spacing:.22em;
}
.napbox-screw{
  position:absolute;
  width:17px;
  height:17px;
  border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#556273 0 10%,#111720 32%,#020408 72%);
  border:1px solid #000;
  box-shadow:inset 0 1px 2px rgba(255,255,255,.12),0 2px 4px rgba(0,0,0,.55);
  z-index:3;
}
.napbox-screw.s1{left:12px;top:70px}
.napbox-screw.s2{left:12px;bottom:78px}
.napbox-screw.s3{right:18px;top:70px}
.napbox-screw.s4{right:18px;bottom:78px}

.napbox-head{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:12px;
  margin:0 28px 12px;
  padding:9px 12px;
  border:1px solid #2e3c50;
  border-radius:10px;
  background:linear-gradient(180deg,#182230,#0e141d);
}
.napbox-head .brand{
  font-size:16px;
  font-weight:900;
  letter-spacing:.14em;
  color:#edf4ff;
  white-space:nowrap;
}
.napbox-head .meta{
  color:#dfe7f2;
  font-size:11px;
  letter-spacing:.06em;
}
.napbox-head .spacer{flex:1}
.napbox-status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 9px;
  border-radius:999px;
  border:1px solid #275638;
  background:#0d2116;
  color:#86efac;
  font-size:10px;
  font-weight:800;
}
.napbox-status .led{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 10px rgba(34,197,94,.7);
}

.napbox-inner{
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:100px minmax(0,1fr);
  gap:14px;
  padding:14px 12px 10px;
  border:1px solid #222d3d;
  border-radius:16px;
  background:
    radial-gradient(circle at 50% 0%,rgba(50,72,100,.13),transparent 40%),
    linear-gradient(180deg,#080d14 0%,#05080c 100%);
  box-shadow:
    inset 0 10px 20px rgba(0,0,0,.4),
    inset 0 0 0 1px rgba(255,255,255,.025);
}

.napbox-side-rail{
  position:relative;
  min-height:100%;

/* =====================================================
   RECEIPT
   ===================================================== */
.receipt-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:150;
  display:none;align-items:flex-start;justify-content:center;
  overflow-y:auto;padding:20px 12px 40px;
  backdrop-filter:blur(4px);
}
.receipt-backdrop.open{display:flex}
.receipt-shell{
  width:100%;max-width:420px;
  display:flex;flex-direction:column;align-items:center;
  gap:14px;
}
.receipt-actions{
  display:flex;gap:8px;width:100%;
}
.receipt-actions .btn{flex:1}

.receipt-paper{
  width:100%;
  background:#fff;
  color:#111;
  padding:24px 20px;
  border-radius:6px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;
  line-height:1.55;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  position:relative;
  /* torn edges */
}
.receipt-paper:before,
.receipt-paper:after{
  content:'';
  position:absolute;left:0;right:0;height:8px;
  background-image:radial-gradient(circle at 6px 0, transparent 6px, #fff 6px);
  background-size:12px 8px;
  background-position:0 0;
}
.receipt-paper:before{top:-7px;transform:scaleY(-1)}
.receipt-paper:after{bottom:-7px}

.rp-header{text-align:center;padding-bottom:6px}
.rp-logo{
  width:52px;height:52px;border-radius:12px;
  background:linear-gradient(135deg,#3b82f6,#1e40af);
  color:#fff;display:inline-flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:800;
  margin-bottom:8px;
  box-shadow:0 3px 8px rgba(59,130,246,.3);
}
.rp-biz{font-size:16px;font-weight:800;letter-spacing:.02em;color:#0f172a}
.rp-tagline{font-size:10px;color:#64748b;font-style:italic;margin-top:2px}
.rp-addr{font-size:10px;color:#475569;margin-top:6px;line-height:1.5}
.rp-contact{font-size:10px;color:#475569;margin-top:2px}

.rp-divider{
  text-align:center;color:#cbd5e1;letter-spacing:-1px;overflow:hidden;margin:10px 0;
  font-size:11px;white-space:nowrap;
}
.rp-divider.solid{color:#0f172a}
.rp-title{
  text-align:center;font-size:13px;font-weight:800;letter-spacing:.15em;color:#0f172a;
  padding:2px 0;
}

.rp-label{font-size:9px;font-weight:800;color:#64748b;letter-spacing:.1em;margin-top:4px;margin-bottom:4px}
.rp-name{font-size:13px;font-weight:800;color:#0f172a;margin-bottom:4px}
.rp-row{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#334155;padding:1.5px 0}
.rp-row span:first-child{color:#64748b}
.rp-row span:last-child{font-weight:600;color:#0f172a;text-align:right;word-break:break-word}
.rp-row.big{
  font-size:14px;font-weight:800;color:#0f172a;
  padding:8px 0;margin:4px 0;
  border-top:1.5px dashed #cbd5e1;
  border-bottom:1.5px dashed #cbd5e1;
}
.rp-row.big span:first-child{color:#0f172a}
.rp-row.big span:last-child{color:#15803d;font-size:16px}

.rp-thanks{text-align:center;font-size:13px;font-weight:800;color:#0f172a;letter-spacing:.1em;margin-top:6px}
.rp-footer{text-align:center;font-size:9px;color:#64748b;margin-top:3px;font-style:italic}
.rp-barcode{
  text-align:center;font-size:8px;color:#94a3b8;letter-spacing:.3em;
  margin-top:12px;
  font-family:ui-monospace,monospace;
}
.rp-void{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);
  font-size:44px;font-weight:900;color:rgba(220,38,38,.15);
  letter-spacing:.1em;pointer-events:none;
}

/* Receipt button in payments table */
.rcpt-btn{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 9px;font-size:11px;font-weight:700;
  background:var(--surface-3);border:1px solid var(--line-2);
  color:var(--ink-2);border-radius:7px;cursor:pointer;font-family:inherit;
}
.rcpt-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* =====================================================
   PRINT — show only the receipt
   ===================================================== */
@media print{
  html,body{background:#fff!important;padding:0!important;margin:0!important}
  body>*{display:none!important}
  #receiptBackdrop{display:block!important;position:static!important;background:#fff!important;padding:0!important;backdrop-filter:none!important;overflow:visible!important}
  .receipt-shell{max-width:100%!important;gap:0!important}
  .no-print{display:none!important}
  .receipt-paper{
    box-shadow:none!important;
    width:80mm!important;
    margin:0 auto!important;
    padding:10mm 6mm!important;
    border-radius:0!important;
    page-break-inside:avoid;
  }
  .receipt-paper:before,.receipt-paper:after{display:none!important}
  @page{margin:6mm}
}

  body{font-size:14px;min-height:100vh;min-height:100dvh}

  }
  .topbar .btn{min-width:44px;min-height:44px;padding:7px 9px;font-size:12px}
  #btnLogout,#btnBackup,#btnRestore{display:none}
  #btnMenu{

    right:50%;bottom:auto;left:auto;
    z-index:90;display:inline-flex;width:54px;height:54px;min-width:54px;

function hasMapCoordinates(point){
  if(point.lat==='' || point.lat==null || point.lng==='' || point.lng==null) return false;
  const lat = Number(point.lat), lng = Number(point.lng);
  return Number.isFinite(lat) && Number.isFinite(lng) && lat>=-90 && lat<=90 && lng>=-180 && lng<=180;
}

function getDistanceStr(lat1, lng1, lat2, lng2){
  const toRadians = degrees=>Number(degrees)*Math.PI/180;
  const dLat = toRadians(lat2)-toRadians(lat1);
  const dLng = toRadians(lng2)-toRadians(lng1);
  const a = Math.sin(dLat/2)**2 +
    Math.cos(toRadians(lat1))*Math.cos(toRadians(lat2))*Math.sin(dLng/2)**2;
  const distanceMeters = 2*6371000*Math.asin(Math.sqrt(Math.min(1,a)));
  return distanceMeters>=1000
    ? `${(distanceMeters/1000).toFixed(2)} km`
    : `${Math.round(distanceMeters)} m`;
}

function parseCoordinates(value){
  const match = String(value||'').trim().match(/^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)$/);
  if(!match) return null;
  const lat = Number(match[1]), lng = Number(match[2]);
  if(!Number.isFinite(lat) || !Number.isFinite(lng) ||
     lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
  return {lat:lat.toFixed(6), lng:lng.toFixed(6)};
}

function normalizeSplitterChoice(value, totalPorts){
  const legacyChoices = {'1:8':'8','1:16':'16','2:32':'2:16'};
  const choice = legacyChoices[String(value)] || String(value||'');
  if(['8','16','2:8','2:16'].includes(choice)) return choice;
  return Number(totalPorts)>=32 ? '2:16' :
    Number(totalPorts)>=16 ? '16' : '8';
}

function splitterPortCount(choice){
  return ({'8':8,'16':16,'2:8':16,'2:16':32})[choice] || 0;
}

/* ------------------------------ helpers ------------------------------ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const FIBER_COLORS = [
  ['#0072bc','Blue'],
  ['#f58220','Orange'],
  ['#2e8b57','Green'],
  ['#8b5a2b','Brown'],
  ['#7b8190','Slate'],
  ['#f5f5f5','White'],
  ['#e53935','Red'],
  ['#111827','Black'],
  ['#f4c430','Yellow'],
  ['#7c3aed','Violet'],
  ['#f472b6','Rose'],
  ['#14b8a6','Aqua']
];
const FIBER_COLOR_MAP = Object.fromEntries(FIBER_COLORS.map(([hex,name])=>[hex.toLowerCase(),name]));
const fiberColorName = value => FIBER_COLOR_MAP[String(value||'').toLowerCase()] || (value ? 'Custom' : 'Not recorded');
const fiberColorOptions = (current='') => {
  const normalized = String(current||'').toLowerCase();
  return `<option value="">— Not recorded —</option>${FIBER_COLORS.map(([hex,name])=>
    `<option value="${hex}" ${normalized===hex?'selected':''}>${name}</option>`
  ).join('')}<option value="__custom__" ${normalized && !FIBER_COLOR_MAP[normalized]?'selected':''}>Custom color</option>`;
};
const fiberColorHex = value => /^#[0-9a-f]{6}$/i.test(String(value||'')) ? String(value) : '#94a3b8';
const escStyleHex = value => fiberColorHex(value).replace(/[^#0-9a-f]/gi,'');
const peso = n => '₱' + Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2, maximumFractionDigits:2});
const num  = n => Number(n||0);
const pad  = n => String(n).padStart(2,'0');
const iso  = d => { const x = new Date(d); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; };
const ym   = d => { const x = new Date(d); return `${x.getFullYear()}-${pad(x.getMonth()+1)}`; };
const todayISO = () => iso(new Date());
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const monthLabel = m => {
  if(!m) return '—';
  const [y,mo] = m.split('-');
  return new Date(y, mo-1, 1).toLocaleDateString('en-PH',{month:'long', year:'numeric'});
};
function dateLabel(value){
  const match = String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!match) return value || '—';
  const [year,month,day] = match.slice(1).map(Number);
  const date = new Date(year,month-1,day);
  if(date.getFullYear()!==year || date.getMonth()!==month-1 || date.getDate()!==day) return value;
  return date.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
const daysAgo = (a,b) => Math.floor((new Date(b) - new Date(a)) / 86400000);
function isAtLeastMonthsOverdue(dueDate, months, referenceDate=todayISO()){
  const match = String(dueDate||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!match || !Number.isInteger(months) || months<0) return false;
  const [year, month, day] = match.slice(1).map(Number);
  const due = new Date(year, month-1, day);
  if(iso(due)!==dueDate) return false;
  due.setDate(1);
  due.setMonth(due.getMonth()+months);
  due.setDate(Math.min(day, new Date(due.getFullYear(), due.getMonth()+1, 0).getDate()));
  return iso(due)<=referenceDate;
}
const uid = () => Math.random().toString(36).slice(2,9);
const PLAN_LABELS = {
  '10mbps':'10 Mbps', '15mbps':'30 Mbps', '20mbps':'20 Mbps',
  '25mbps':'25 Mbps', '30mbps':'30 Mbps', '50mbps':'50 Mbps'
};

function planKey(plan){
  return String(plan||'').toLowerCase().replace(/\s+/g,'');
}

function normalizePlanLabel(plan){
  return PLAN_LABELS[planKey(plan)] || plan;
}

function pushErrorMessage(response, data){
  return data?.error || `Notification request failed (${response.status})`;
}

async function notificationRequest(url, options={}){
  const response = await fetch(url, {
    ...options,
    headers:{'Content-Type':'application/json',...(options.headers||{})}
  });
  const data = await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(pushErrorMessage(response,data));
  return data;
}

function pushButtonState(enabled){
  const enable = document.querySelector('[data-act="enablePushNotifications"]');
  const disable = document.querySelector('[data-act="disablePushNotifications"]');
  if(enable) enable.hidden = enabled;
  if(disable) disable.hidden = !enabled;
}

async function updatePushNotificationStatus(){
  const status = document.getElementById('pushNotificationStatus');
  if(!status) return;
  try{
    const config = await notificationRequest('/api/notifications/config');
    if(!config.enabled){
      status.textContent = 'Notifications are not configured on the server yet. Ask the administrator to add VAPID keys.';
      pushButtonState(false);
      return;
    }
    if(!('Notification' in window) || !('serviceWorker' in navigator)){
      status.textContent = 'This browser does not support web push notifications.';
      pushButtonState(false);
      return;
    }
    const registration = await navigator.serviceWorker.getRegistration('/');
    const subscription = registration && await registration.pushManager.getSubscription();
    const active = Notification.permission==='granted' && Boolean(subscription);
    status.textContent = active
      ? 'Daily notifications are enabled on this device.'
      : Notification.permission==='denied'
        ? 'Notifications are blocked by this browser. Allow them in site settings to enable reminders.'
        : 'Notifications are currently off on this device.';
    pushButtonState(active);
  }catch(error){
    console.error('Could not check notification status',error);
    status.textContent = `Could not check notification status: ${error.message}`;
  }
}

function decodeVapidKey(value){
  const padding='='.repeat((4-value.length%4)%4);
  const base64=(value+padding).replace(/-/g,'+').replace(/_/g,'/');
  return Uint8Array.from(atob(base64),character=>character.charCodeAt(0));
}

async function enablePushNotifications(){
  try{
    if(!window.isSecureContext){
      throw new Error('Notifications require HTTPS (or localhost).');
    }
    if(!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)){
      throw new Error('This browser does not support web push notifications.');
    }
    const config=await notificationRequest('/api/notifications/config');
    if(!config.enabled || !config.publicKey){
      throw new Error('Notifications are not configured on the server yet. Ask the administrator to add VAPID keys.');
    }
    const permission=await Notification.requestPermission();
    if(permission!=='granted') throw new Error('Browser notification permission was not granted.');
    const registration=await navigator.serviceWorker.register('/service-worker.js',{scope:'/'});
    const ready=await navigator.serviceWorker.ready;
    let subscription=await ready.pushManager.getSubscription();
    if(!subscription){
      subscription=await registration.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:decodeVapidKey(config.publicKey)
      });
    }
    await notificationRequest('/api/notifications/subscribe',{
      method:'POST',
      body:JSON.stringify(subscription)
    });
    toast('Daily overdue notifications enabled on this device');
    await updatePushNotificationStatus();
  }catch(error){
    console.error('Could not enable notifications',error);
    toast(error.message);
  }
}

async function testBrowserNotification(){
  try{
    if(!('Notification' in window)){
      throw new Error('This browser does not support notifications.');
    }
    if(!window.isSecureContext){
      throw new Error('Notifications require HTTPS (or localhost).');
    }
    let permission=Notification.permission;
    if(permission==='default') permission=await Notification.requestPermission();
    if(permission!=='granted'){
      throw new Error('Notification permission is blocked. Allow notifications for this site in your browser settings.');
    }
    const notification=new Notification('NAPBOX notification test',{
      body:'Notifications are working on this device. Click here to return to NAPBOX.',
      tag:'napbox-notification-test'
    });
    notification.onclick=()=>{
      window.focus();
      notification.close();
    };
    toast('Test notification sent');
  }catch(error){
    console.error('Could not show test notification',error);
    toast(error.message);
  }
}

async function disablePushNotifications(){
  try{
    const registration=await navigator.serviceWorker.getRegistration('/');
    const subscription=registration && await registration.pushManager.getSubscription();
    if(subscription){
      await notificationRequest('/api/notifications/subscribe',{
        method:'DELETE',
        body:JSON.stringify({endpoint:subscription.endpoint})
      });
      await subscription.unsubscribe();
    }
    toast('Daily notifications turned off on this device');
    await updatePushNotificationStatus();
  }catch(error){
    console.error('Could not disable notifications',error);
    toast(error.message);
  }
}

function migratePlanPricing(){
  let changed = false;
  const plans = DB.settings.plans || [];
  DB.settings.plans = [...new Set(plans.map(normalizePlanLabel))];
  if(JSON.stringify(plans)!==JSON.stringify(DB.settings.plans)) changed = true;

  (DB.clients||[]).forEach(client=>{
    const label = normalizePlanLabel(client.plan);
    if(label!==client.plan){ client.plan = label; changed = true; }
  });
  (DB.installs||[]).forEach(install=>{
    const label = normalizePlanLabel(install.plan);
    if(label!==install.plan){ install.plan = label; changed = true; }
  });
  return changed;
}

function standardPlanRate(plan){
  const key = planKey(plan);
  if(key==='25mbps') return 800;
  if(key==='50mbps') return 1000;
  return null;
}

function planForRate(rate){
  if(rate===800) return '25 Mbps';
  if(rate===1000) return '50 Mbps';
  return 'Unspecified';
}

function addDefaultPricingPlans(){
  if(DB.settings.pricingDefaultsVersion===1) return false;
  if(!DB.settings.plans.some(plan=>planKey(plan)==='25mbps')){
    DB.settings.plans.push('25 Mbps');
  }
  DB.settings.pricingDefaultsVersion = 1;
  return true;
}

function correctLegacy600Pricing(){
  if(DB.settings.legacyPricingCorrectionVersion===1) return false;
  (DB.clients||[]).forEach(client=>{
    if(num(client.rate)===600){
      client.rate = 800;
      client.plan = '25 Mbps';
    }
  });
  (DB.billing||[]).forEach(invoice=>{
    if(num(invoice.amountDue)===600) invoice.amountDue = 800;
  });
  DB.settings.legacyPricingCorrectionVersion = 1;
  return true;
}

function nextId(prefix, arr){
  let max = 0;
  arr.forEach(r=>{
    const m = String(r.id||'').match(/(\d+)\s*$/);
    if(m) max = Math.max(max, +m[1]);
  });
  return `${prefix}-${String(max+1).padStart(4,'0')}`;
}

function nextReceiptNo(){
  const y = new Date().getFullYear();
  const prefix = `RCP-${y}-`;
  let max = 0;
  (DB.payments||[]).forEach(p=>{
    if(p.receiptNo && p.receiptNo.startsWith(prefix)){
      const n = parseInt(p.receiptNo.slice(prefix.length), 10) || 0;
      max = Math.max(max, n);
    }
  });
  return prefix + String(max+1).padStart(4,'0');
}

/* ------------------------------ storage ------------------------------ */
const DATABASE_NAME = 'isp-manager-database';
const DATABASE_STORE = 'records';
const PENDING_SAVE_KEY = `${KEY}-pending-save`;
let databasePromise = null;
let saveRevision = 0;
let saveQueue = Promise.resolve();

function setSaveStatus(message, status='saved'){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.textContent = message;
  el.dataset.state = status;
}

function openDatabase(){
  if(!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB is unavailable'));
  if(!databasePromise){
    databasePromise = new Promise((resolve,reject)=>{
      const request = indexedDB.open(DATABASE_NAME, 1);
      request.onupgradeneeded = ()=>{
        if(!request.result.objectStoreNames.contains(DATABASE_STORE)){
          request.result.createObjectStore(DATABASE_STORE);
        }
      };
      request.onsuccess = ()=>resolve(request.result);
      request.onerror = ()=>reject(request.error || new Error('Could not open database'));
    }).catch(error=>{
      databasePromise = null;
      throw error;
    });
  }
  return databasePromise;
}

function save(){
  const revision = ++saveRevision;
  const snapshot = JSON.parse(JSON.stringify(DB));
  let localSaved = false;
  try{
    localStorage.setItem(KEY, JSON.stringify(snapshot));
    localSaved = true;
    localStorage.setItem(PENDING_SAVE_KEY, '1');
  }catch(error){ console.warn('Local backup could not be updated', error); }
  setSaveStatus('Saving…', 'saving');

  openDatabase().then(database=>new Promise((resolve,reject)=>{
    const transaction = database.transaction(DATABASE_STORE, 'readwrite');
    transaction.objectStore(DATABASE_STORE).put(snapshot, 'current');
    transaction.oncomplete = resolve;
    transaction.onerror = ()=>reject(transaction.error || new Error('Database write failed'));
    transaction.onabort = ()=>reject(transaction.error || new Error('Database write aborted'));
  })).catch(error=>console.warn('Local database backup failed', error));

  saveQueue = saveQueue.catch(()=>{}).then(()=>fetch('/api/state',{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({state:snapshot})
  })).then(response=>{
    if(response.status===401){
      window.location.replace('/login');
      throw new Error('Authentication required');
    }
    if(!response.ok) throw new Error(`PostgreSQL save failed (${response.status})`);
    if(revision===saveRevision){
      try{ localStorage.removeItem(PENDING_SAVE_KEY); }
      catch(error){ console.warn('Could not clear local pending-save marker', error); }
      setSaveStatus('Saved to PostgreSQL');
    }
    return true;
  }).catch(error=>{
    console.warn('PostgreSQL save failed', error);
    if(revision===saveRevision){
      setSaveStatus(localSaved ? 'PostgreSQL unavailable · saved on this device' : 'PostgreSQL save failed', localSaved ? 'warning' : 'error');
    }
    return localSaved;
  });
  return saveQueue;
}

async function load(){
  try{
    if(localStorage.getItem(PENDING_SAVE_KEY)==='1'){
      const raw = localStorage.getItem(KEY);
      if(raw) return JSON.parse(raw);
    }
  }catch(error){ console.warn('Pending local save could not be loaded', error); }
  try{
    const response = await fetch('/api/state');
    if(response.status===401){
      window.location.replace('/login');
      return null;
    }
    if(!response.ok) throw new Error(`PostgreSQL load failed (${response.status})`);
    const payload = await response.json();
    if(payload.state) return payload.state;
  }catch(error){ console.warn('PostgreSQL unavailable; checking local backup', error); }
  try{
    const database = await openDatabase();
    const stored = await new Promise((resolve,reject)=>{
      const transaction = database.transaction(DATABASE_STORE, 'readonly');
      const request = transaction.objectStore(DATABASE_STORE).get('current');
      request.onsuccess = ()=>resolve(request.result || null);
      request.onerror = ()=>reject(request.error || new Error('Database read failed'));
    });
    if(stored) return stored;
  }catch(error){ console.warn('Database unavailable; checking local backup', error); }
  try{
    const raw = localStorage.getItem(KEY) || localStorage.getItem('isp-manager-v2');
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn(e); }
  return null;
}

/* ------------------------------ computed ------------------------------ */
function billingRows(){
  const today = todayISO();
  return DB.billing.map(b=>{
    const client = DB.clients.find(c=>c.id===b.clientId);
    const paid = DB.payments
      .filter(p=>p.clientId===b.clientId && p.month===b.month)
      .reduce((s,p)=>s+num(p.amount),0);
    const amountDue = num(b.amountDue);
    const balance = amountDue - paid;
    const daysOverdue = balance > 0 ? Math.max(0, daysAgo(b.dueDate, today)) : 0;
    const dueAsOfToday = balance > 0 && /^\d{4}-\d{2}-\d{2}$/.test(b.dueDate) && b.dueDate<=today;
    const status = balance <= 0 ? 'Paid' : (paid === 0 ? 'Unpaid' : 'Partial');
    const aging = balance <= 0 ? 'Paid'
      : daysOverdue === 0 ? 'Current'
      : daysOverdue <= 7 ? '1-7 days'
      : daysOverdue <= 15 ? '8-15 days'
      : '16+ days';
    return {
      ...b, clientName: client ? client.name : '—',
      clientStatus: client ? client.status : '—',
      paid, balance, status, daysOverdue, dueAsOfToday, aging
    };
  });
}

function napStats(box){
  const ports = DB.napPorts.filter(p=>p.napId===box.id).sort((a,b)=>a.port-b.port);
  const used = ports.filter(p=>p.status==='Used').length;
  const faulty = ports.filter(p=>p.status==='Faulty').length;
  const reserved = ports.filter(p=>p.status==='Reserved').length;
  const total = num(box.totalPorts) || ports.length;
  const free = Math.max(0, total - used - faulty - reserved);
  return {used, free, faulty, reserved, total, ports};
}

function agingClass(a){
  return a==='Paid' ? 'b-green'
    : a==='Current' ? 'b-gray'
    : a==='1-7 days' ? 'b-amber'
    : a==='8-15 days' ? 'b-orange'
    : 'b-red';
}

      if(controls) controls.remove();
      return;
    }
    if(!controls){
      controls = document.createElement('div');
      controls.className = 'table-scroll-controls';
      controls.innerHTML = `
        <button type="button" data-table-scroll="-1" aria-label="Scroll table left">‹</button>
        <span>Swipe sideways to see more columns</span>
        <button type="button" data-table-scroll="1" aria-label="Scroll table right">›</button>`;
      wrapper.after(controls);
    }
    const syncButtons = ()=>{
      const left = controls.querySelector('[data-table-scroll="-1"]');
      const right = controls.querySelector('[data-table-scroll="1"]');
      left.disabled = wrapper.scrollLeft<=1;
      right.disabled = wrapper.scrollLeft+wrapper.clientWidth>=wrapper.scrollWidth-1;
    };
    if(!controls._scrollSyncBound){
      wrapper.addEventListener('scroll',syncButtons,{passive:true});
      controls._scrollSyncBound = true;
    }
    syncButtons();
  });
}

function openInvoicePayment(invoiceId){
  const invoice = DB.billing.find(row=>String(row.id)===String(invoiceId));
  const current = invoice && billingRows().find(row=>String(row.id)===String(invoiceId));
  if(!invoice || !current){ toast('Invoice not found'); return; }
  const balance = Math.round((Number(current.balance)+Number.EPSILON)*100)/100;
  if(!Number.isFinite(balance) || balance<=0){ toast('This invoice has no valid outstanding balance'); return; }

  const methods = DB.settings.methods?.length ? DB.settings.methods : ['Cash'];
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div class="modal-head">
      <h2>Record Payment</h2>
      <button class="btn sm" type="button" data-act="closeModal" aria-label="Close">✕</button>
    </div>
    <p class="muted">${esc(current.clientName)} <span class="tiny">(${esc(current.clientId)})</span><br>
      ${esc(monthLabel(invoice.month))} · Balance ${peso(balance)}</p>
    <form id="invoicePaymentForm">
      <label class="field"><span>Payment Date</span>
        <input name="date" type="date" value="${todayISO()}" required>
      </label>
      <label class="field"><span>Amount Paid (₱)</span>
        <input name="amount" type="number" min="0.01" max="${balance.toFixed(2)}" step="0.01" value="${balance.toFixed(2)}" required>
      </label>
      <label class="field"><span>Mode of Payment</span>
        <select name="method" required>${methods.map(method=>
          `<option value="${esc(method)}">${esc(method)}</option>`
        ).join('')}</select>
      </label>
      <label class="field"><span>Reference Number (optional)</span>
        <input name="ref" type="text" autocomplete="off">
      </label>
      <div class="modal-actions">
        <button type="button" class="btn" data-act="closeModal">Cancel</button>
        <button type="submit" class="btn primary">Save Payment</button>
      </div>
    </form>`;
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('invoicePaymentForm').addEventListener('submit', async event=>{
    event.preventDefault();
    const form = event.currentTarget;
    const amount = Math.round(Number(form.elements.namedItem('amount').value)*100)/100;
    const latest = billingRows().find(row=>String(row.id)===String(invoiceId));
    if(!latest || latest.balance<=0){
      toast('This invoice is already paid');
      closeModal();
      render();
      return;
    }
    const latestBalance = Math.round((Number(latest.balance)+Number.EPSILON)*100)/100;
    if(!Number.isFinite(latestBalance) || latestBalance<=0){
      toast('This invoice has no valid outstanding balance');
      return;
    }
    if(!Number.isFinite(amount) || amount<=0 || amount>latestBalance){
      toast(`Enter an amount from ₱0.01 to ${peso(latestBalance)}`);
      return;
    }
    const submit = form.querySelector('[type="submit"]');
    submit.disabled = true;
    const paymentDate = form.elements.namedItem('date').value;
    if(!paymentDate || !Number.isFinite(new Date(`${paymentDate}T00:00:00`).getTime()) ||
       iso(new Date(`${paymentDate}T00:00:00`))!==paymentDate){
      toast('Choose a valid payment date');
      submit.disabled = false;
      return;
    }
    const payment = {
      id:nextId('P', DB.payments),
      receiptNo:nextReceiptNo(),
      date:paymentDate,
      createdAt:new Date().toISOString(),
      clientId:invoice.clientId,
      month:invoice.month,
      amount,
      method:form.elements.namedItem('method').value,
      ref:form.elements.namedItem('ref').value.trim(),
      receivedBy:'Admin',
      notes:''
    };
    const previousState = JSON.parse(JSON.stringify(DB));
    DB.payments.push(payment);
    const persisted = await save();
    if(!persisted){
      DB = previousState;
      toast('Could not save this payment. Please check your connection and try again.');
      submit.disabled = false;
      return;
    }
    closeModal();
    render();
    toast('Payment recorded');
    setTimeout(()=>openReceipt(payment.id), 200);
  });
}

function napGridView(){
  const boxes = DB.napBoxes;
  const cards = boxes.map(b=>{
    const s = napStats(b);
    const pct = s.total ? Math.round(s.used/s.total*100) : 0;
    const cls = s.free<=2 ? 'full' : s.free<=4 ? 'warn' : 'ok';
    const hasCoordinates = b.lat!=='' && b.lat!=null && b.lng!=='' && b.lng!=null &&
      Number.isFinite(Number(b.lat)) && Number.isFinite(Number(b.lng));
    const portChips = s.ports.map(p=>{
      const c = DB.clients.find(x=>x.id===p.clientId);
      const label = p.status==='Used' && c ? c.name.split(' ')[0] : p.status;
      return `<div class="port ${p.status.toLowerCase()}" title="Port ${p.port} — ${esc(label)}">
        <span class="n">${p.port}</span>${esc(label)}
      </div>`;
    }).join('');

    return `
    <div class="card">
      <div class="card-head">
        <h2>${esc(b.id)} <span class="muted small">${esc(b.label||'')}</span></h2>
        <span class="badge ${s.free<=2?'b-red':s.free<=4?'b-amber':'b-green'}">${s.free} free</span>
      </div>
      <div class="small muted" style="margin-bottom:8px">
        📍 ${esc(b.address||'')}${b.landmark?` · ${esc(b.landmark)}`:''}
        ${hasCoordinates?` · ${b.lat}, ${b.lng} · <button class="map-link" type="button" data-act="focusNapMap" data-id="${esc(b.id)}">map</button>`:''}
      </div>
      <div class="bar ${cls}"><span style="width:${pct}%"></span></div>
      <div class="flex small muted" style="margin-top:6px">
        <span>${s.used}/${s.total} used</span><span>·</span>
        <span>${s.free} free</span>
        ${s.faulty?`<span>· <span style="color:var(--red)">${s.faulty} faulty</span></span>`:''}
        <span class="spacer"></span>
        <span>${esc(b.splitter||'')} · ${esc(b.upstreamId||b.upstream||'')}</span>
      </div>
      <div class="ports">${portChips}</div>
      <div class="flex" style="margin-top:12px">
        <button class="btn sm" data-act="edit" data-table="napBoxes" data-id="${esc(b.id)}">Edit Box</button>
        <button class="btn sm" data-act="viewSplitter" data-id="${esc(b.id)}">View Splitter</button>
        <span class="spacer"></span>
        <button class="btn sm danger" data-act="del" data-table="napBoxes" data-id="${esc(b.id)}">✕</button>
      </div>
      ${b.route?`<div class="note" style="margin-top:10px">🔧 ${esc(b.route)}</div>`:''}
    </div>`;
  }).join('');

  return cards || `<div class="card"><div class="empty"><div class="big">🔌</div>No NAP boxes yet.</div></div>`;
}

function showMapContextMenuGlobal(point, lat, lng, target=null){
  const menu = document.getElementById('mapContextMenu');
  const wrap = document.getElementById('mapWrap');
  if(!menu || !wrap) return;
  state.mapContextLocation = {lat:Number(lat).toFixed(6), lng:Number(lng).toFixed(6)};
  state.mapContextTarget = target;
  const deleteAction = menu.querySelector('[data-act="deleteMapTarget"]');
  if(deleteAction) deleteAction.hidden = !target;
  menu.hidden = false;
  const maxLeft = Math.max(0, wrap.clientWidth-menu.offsetWidth-8);
  const maxTop = Math.max(0, wrap.clientHeight-menu.offsetHeight-8);
  menu.style.left = `${Math.min(Math.max(point.x,8),maxLeft)}px`;
  menu.style.top = `${Math.min(Math.max(point.y,8),maxTop)}px`;
}

function hideMapContextMenuGlobal(){
  const menu = document.getElementById('mapContextMenu');
  if(menu) menu.hidden = true;
  state.mapContextLocation = null;
  state.mapContextTarget = null;
}

async function initMap(){
  const el = document.getElementById('map');
  if(!el) return;
  const initToken = ++mapInitToken;
  const status = document.getElementById('mapStatus');
  const showMapStatus = (title, message)=>{
    if(!status) return;
    status.innerHTML = `<strong>${esc(title)}</strong>${esc(message)}`;
    status.hidden = false;
  };
  const hideMapStatus = ()=>{
    if(status) status.hidden = true;
  };
  const hideMapContextMenu = ()=>{
    hideMapContextMenuGlobal();
  };
  const hb = DB.settings.homeBase;
  let mapCenter = mapViewport ? [mapViewport.lat, mapViewport.lng] : [Number(hb.lat), Number(hb.lng)];
  let mapZoom = mapViewport ? mapViewport.zoom : 15;
  if(mapInstance){
    mapInstance.remove();
    mapInstance = null;
  }
  mapMarkers = {};
  mapLines = [];
  mapLineEvents = [];
  mapHoverPopup = null;
  if(state.mapFocus){
    mapCenter = [Number(state.mapFocus.lat), Number(state.mapFocus.lng)];
    mapZoom = 18;
    mapViewport = null;
  }
  mapEngine = null;
  mapboxAccessToken = null;
  leafletMapOverlays = null;
  showMapStatus('Loading map…', 'Connecting to the map service.');
  try{
    const response = await fetch('/api/config');
    if(!response.ok) throw new Error('Could not load map configuration');
    const config = await response.json();
    mapboxAccessToken = config.mapboxAccessToken || null;
    if(initToken!==mapInitToken || document.getElementById('map')!==el) return;
    if(!mapboxAccessToken){
      if(typeof L==='undefined'){
        showMapStatus('Map library unavailable', 'Allow network access to unpkg.com and reload the page.');
        return;
      }
      mapEngine = 'leaflet';
      mapInstance = L.map(el, {zoomControl:false}).setView(mapCenter, mapZoom);
      state.mapFocus = null;
      mapInstance.on('moveend', ()=>{
        const center = mapInstance.getCenter();
        mapViewport = {lat:center.lat, lng:center.lng, zoom:mapInstance.getZoom()};
      });
      const tiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom:19,
        attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
      }).addTo(mapInstance);
      let tilesLoaded = false;
      tiles.on('tileload', ()=>{
        tilesLoaded = true;
        hideMapStatus();
      });
      tiles.on('tileerror', ()=>{
        if(!tilesLoaded) showMapStatus('Map tiles unavailable', 'Check your internet connection and allow basemaps.cartocdn.com.');
      });
      L.control.zoom({position:'topright'}).addTo(mapInstance);
      leafletMapOverlays = L.layerGroup().addTo(mapInstance);
      mapInstance.on('contextmenu', event=>{
        event.originalEvent.preventDefault();
        const marker = event.originalEvent.target.closest('.leaflet-marker-icon');
        const mapTarget = marker?.dataset.mapTable && marker?.dataset.mapId
          ? {table:marker.dataset.mapTable,id:marker.dataset.mapId}
          : null;
        showMapContextMenuGlobal(event.containerPoint, event.latlng.lat, event.latlng.lng, mapTarget);
      });
      mapInstance.on('click', hideMapContextMenu);
      const map3dButton = document.getElementById('map3dToggle');
      if(map3dButton) map3dButton.hidden = true;
      renderLeafletMapMarkers();
      if(state.mapPlaceClient){
        mapInstance.once('click', event=>{
          state.mapPlaceClient = false;
          openClientHouseForm(event.latlng.lat, event.latlng.lng);
        });
      }
      if(!tilesLoaded) showMapStatus('Loading map…', 'Loading dark map tiles.');
      mapInstance.invalidateSize();
      return;
    }
    if(typeof mapboxgl==='undefined'){
      showMapStatus('Map library unavailable', 'Allow network access to api.mapbox.com and reload the page.');
      return;
    }
    mapEngine = 'mapbox';
    mapboxgl.accessToken = mapboxAccessToken;
    mapInstance = new mapboxgl.Map({
      container:el,
      style:'mapbox://styles/mapbox/dark-v11',
      center:[mapCenter[1], mapCenter[0]],
      zoom:mapZoom,
      pitch:state.map3d ? 55 : 0,
      antialias:true
    });
    state.mapFocus = null;
    mapInstance.on('moveend', ()=>{
      if(initToken!==mapInitToken || document.getElementById('map')!==el) return;
      const center = mapInstance.getCenter();
      mapViewport = {lat:center.lat, lng:center.lng, zoom:mapInstance.getZoom()};
    });
    let mapLoaded = false;
    mapInstance.on('error', event=>{
      if(initToken!==mapInitToken || mapLoaded || document.getElementById('map')!==el) return;
      const error = event.error || {};
      const statusCode = Number(error.status);
      if(statusCode===401 || statusCode===403){
        showMapStatus('Mapbox rejected the token', 'Check that MAPBOX_ACCESS_TOKEN is valid, is a public pk. token, and allows this site’s domain.');
      }else{
        showMapStatus('Map could not load', 'Check the public token, its allowed URL restrictions, and the connection to Mapbox.');
      }
      console.error('Mapbox map error', error);
    });
    mapInstance.addControl(new mapboxgl.NavigationControl({visualizePitch:true}), 'top-right');
    mapHoverPopup = new mapboxgl.Popup({closeButton:false, closeOnClick:false, offset:8});
    mapInstance.on('contextmenu', event=>{
      event.originalEvent.preventDefault();
      const marker = event.originalEvent.target.closest('.mapboxgl-marker');
      const mapTarget = marker?.dataset.mapTable && marker?.dataset.mapId
        ? {table:marker.dataset.mapTable,id:marker.dataset.mapId}
        : null;
      showMapContextMenuGlobal(event.point, event.lngLat.lat, event.lngLat.lng, mapTarget);
    });
    mapInstance.on('click', hideMapContextMenu);
    mapInstance.on('load', ()=>{
      if(initToken!==mapInitToken || document.getElementById('map')!==el) return;
      mapLoaded = true;
      hideMapStatus();
      try{ addMapBuildings(); }
      catch(error){ console.warn('3D buildings layer could not be added', error); }
      renderMapMarkers();
      setMap3dMode(state.map3d, false);
      if(state.mapPlaceClient){
        mapInstance.once('click', event=>{
          state.mapPlaceClient = false;
          openClientHouseForm(event.lngLat.lat, event.lngLat.lng);
        });
      }
      document.getElementById('map3dToggle')?.addEventListener('click', ()=>setMap3dMode(!state.map3d));
      mapInstance.resize();
    });
  }catch(error){
    console.error('Mapbox failed to load', error);
    showMapStatus('Map could not start', 'Check MAPBOX_ACCESS_TOKEN and allow this site’s domain in your Mapbox token settings.');
  }
}

function renderLeafletMapMarkers(){
  if(mapEngine!=='leaflet' || !mapInstance || !leafletMapOverlays) return;
  leafletMapOverlays.clearLayers();
  mapMarkers = {};
  const hb = DB.settings.homeBase;
  const addLine = (start, end, color, dashed, tooltip)=>{
    L.polyline([start,end], {
      color,
      weight:dashed ? 2 : 3,
      opacity:0.8,
      dashArray:dashed ? '6 6' : null
    }).bindTooltip(esc(tooltip)).addTo(leafletMapOverlays);
  };
  const makeMarker = (key, element, lat, lng, popup, onDrag)=>{
    const isNapBox = element.classList.contains('napbox-map-marker');
    const isClient = key.startsWith('client:');
    if(isNapBox || isClient){
      element.dataset.mapTable = isNapBox ? 'napBoxes' : 'clients';
      element.dataset.mapId = isNapBox ? key : key.slice('client:'.length);
    }
    const marker = L.marker([Number(lat),Number(lng)], {
      draggable:!isNapBox,
      icon:L.divIcon({
        className:'',
        html:element.outerHTML,
        iconSize:isNapBox ? [52,60] : null,
        iconAnchor:isNapBox ? [26,58] : [16,16]
      })
    }).addTo(leafletMapOverlays);
    marker.bindPopup(popup);
    if(isNapBox || isClient){
      marker.on('contextmenu', event=>{
        event.originalEvent.preventDefault();
        event.originalEvent.stopPropagation();
        showMapContextMenuGlobal(event.containerPoint, event.latlng.lat, event.latlng.lng, {
          table:isNapBox?'napBoxes':'clients',
          id:isNapBox?key:key.slice('client:'.length)
        });
      });
    }
    if(!isNapBox) marker.on('dragend', ()=>{
      const point = marker.getLatLng();
      onDrag(point);
    });
    mapMarkers[key] = marker;
    return marker;
  };

  const homeElement = document.createElement('div');
  homeElement.className = 'home-marker';
  homeElement.textContent = '🏠';
  makeMarker('home', homeElement, hb.lat, hb.lng,
    `<b>${esc(hb.name)}</b><br><span class="small muted">Drag to reposition</span>`,
    point=>{
      DB.settings.homeBase.lat = point.lat;
      DB.settings.homeBase.lng = point.lng;
      save(); renderLeafletMapMarkers();
    }
  );

  DB.napBoxes.forEach(box=>{
    if(!hasMapCoordinates(box)) return;
    let sourceLat = hb.lat, sourceLng = hb.lng, uplinkName = hb.name;
    if(box.uplinkId){
      const parent = DB.napBoxes.find(item=>item.id===box.uplinkId);
      if(parent && parent.lat!=='' && parent.lng!==''){
        sourceLat = parent.lat; sourceLng = parent.lng; uplinkName = parent.label || parent.id;
      }
    }
    const distance = getDistanceStr(sourceLat, sourceLng, box.lat, box.lng);
    addLine([Number(sourceLat),Number(sourceLng)], [Number(box.lat),Number(box.lng)],
      box.color || '#3b82f6', Boolean(box.uplinkId), distance);

    const element = document.createElement('div');
    element.innerHTML = napBoxMarkerMarkup(box.id);
    const napMarker = element.firstElementChild;
    const popup = `
      <b>${esc(box.id)}</b><br>
      <span style="font-size:11px;color:#94a3b8">${esc(box.label||'')}</span><br>
      <span style="font-size:11px;color:#94a3b8">Uplink: ${esc(uplinkName)} · ${esc(distance)}</span><br><br>
      <button onclick="openSplitterFromMap('${esc(box.id)}')"
        style="background:#3b82f6;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">
        Open Splitter
      </button>`;
    makeMarker(box.id, napMarker, box.lat, box.lng, popup, point=>{
      const current = DB.napBoxes.find(item=>item.id===box.id);
      if(current){ current.lat = point.lat; current.lng = point.lng; save(); renderLeafletMapMarkers(); }
    });
  });

  DB.clients.forEach(client=>{
    if(client.lat==='' || client.lng==='' || client.lat==null || client.lng==null ||
       !Number.isFinite(Number(client.lat)) || !Number.isFinite(Number(client.lng))) return;
    const lat = Number(client.lat), lng = Number(client.lng);
    const nap = DB.napBoxes.find(box=>box.id===client.napId);
    if(nap && nap.lat!=='' && nap.lng!=='' && Number.isFinite(Number(nap.lat)) && Number.isFinite(Number(nap.lng))){
      addLine([Number(nap.lat),Number(nap.lng)], [lat,lng], '#22c55e', true,
        `Client drop · ${getDistanceStr(nap.lat,nap.lng,lat,lng)}`);
    }
    const element = document.createElement('div');
    element.className = 'client-house-marker';
    element.textContent = '⌂';
    const connection = nap ? `${esc(nap.id)} · port ${esc(client.port||'—')}` : 'Not connected to a NAP';
    const popup = `
      <b>${esc(client.name)}</b><br>
      <span style="font-size:11px;color:#94a3b8">${esc(client.plan||'')}</span><br>
      <span style="font-size:11px;color:#94a3b8">${connection}</span><br><br>
      <button onclick="openClientFromMap(${esc(JSON.stringify(client.id))})"
        style="background:#3b82f6;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">
        Edit Client
      </button>
      <button onclick="deleteRecord('clients',${esc(JSON.stringify(client.id))})"
        style="background:#991b1b;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;margin-left:6px">
        Delete Client
      </button>`;
    makeMarker(`client:${client.id}`, element, lat, lng, popup, point=>{
      client.lat = point.lat;
      client.lng = point.lng;
      save(); renderLeafletMapMarkers();
    });
  });
}

function addMapBuildings(){
  if(mapInstance.getLayer('napbox-3d-buildings')) return;
  mapInstance.addLayer({
    id:'napbox-3d-buildings',
    source:'composite',
    'source-layer':'building',
    filter:['==',['get','extrude'],'true'],
    minzoom:15,
    type:'fill-extrusion',
    paint:{
      'fill-extrusion-color':'#94a3b8',
      'fill-extrusion-height':['interpolate',['linear'],['zoom'],15,0,['get','height']],
      'fill-extrusion-base':['interpolate',['linear'],['zoom'],15,0,['get','min_height']],
      'fill-extrusion-opacity':0.72
    }
  });
}

function setMap3dMode(enabled, animate=true){
  if(!mapInstance) return;
  state.map3d = enabled;
  mapInstance.easeTo({pitch:enabled ? 55 : 0, duration:animate ? 500 : 0});
  if(mapInstance.getLayer('napbox-3d-buildings')){
    mapInstance.setLayoutProperty('napbox-3d-buildings', 'visibility', enabled ? 'visible' : 'none');
  }
  const button = document.getElementById('map3dToggle');
  if(button) button.textContent = enabled ? 'Enable 2D' : 'Enable 3D';
}

function addMapLine(coordinates, color, dashed, tooltip){
  const id = `napbox-line-${mapLines.length}`;
  const layerId = `${id}-layer`;
  mapInstance.addSource(id, {
    type:'geojson',
    data:{type:'Feature', geometry:{type:'LineString', coordinates}, properties:{}}
  });
  mapInstance.addLayer({
    id:layerId,
    type:'line',
    source:id,
    paint:{
      'line-color':color,
      'line-width':dashed ? 2 : 3,
      'line-opacity':0.8,
      ...(dashed ? {'line-dasharray':[2,2]} : {})
    }
  });
  const onEnter = event=>{
    mapInstance.getCanvas().style.cursor = 'pointer';
    mapHoverPopup.setLngLat(event.lngLat).setHTML(`<span class="small">${esc(tooltip)}</span>`).addTo(mapInstance);
  };
  const onLeave = ()=>{
    mapInstance.getCanvas().style.cursor = '';
    mapHoverPopup.remove();
  };
  mapInstance.on('mouseenter', layerId, onEnter);
  mapInstance.on('mouseleave', layerId, onLeave);
  mapLineEvents.push({layerId, onEnter, onLeave});
  mapLines.push(id);
}

function renderMapMarkers(){
  if(!mapInstance) return;
  if(mapEngine==='leaflet'){
    renderLeafletMapMarkers();
    return;
  }
  Object.values(mapMarkers).forEach(marker=>marker.remove());
  mapLineEvents.forEach(({layerId,onEnter,onLeave})=>{
    mapInstance.off('mouseenter', layerId, onEnter);
    mapInstance.off('mouseleave', layerId, onLeave);
  });
  mapLines.forEach(id=>{
    const layerId = `${id}-layer`;
    if(mapInstance.getLayer(layerId)) mapInstance.removeLayer(layerId);
    if(mapInstance.getSource(id)) mapInstance.removeSource(id);
  });
  mapMarkers = {}; mapLines = []; mapLineEvents = [];

  const hb = DB.settings.homeBase;
  const homeElement = document.createElement('div');
  homeElement.className = 'home-marker';
  homeElement.textContent = '🏠';
  const homeMarker = new mapboxgl.Marker({element:homeElement, draggable:true, anchor:'center'})
    .setLngLat([Number(hb.lng), Number(hb.lat)])
    .setPopup(new mapboxgl.Popup({offset:20}).setHTML(`<b>${esc(hb.name)}</b><br><span class="small muted">Drag to reposition</span>`))
    .addTo(mapInstance);
  homeMarker.on('dragend', ()=>{
    const p = homeMarker.getLngLat();
    DB.settings.homeBase.lat = p.lat;
    DB.settings.homeBase.lng = p.lng;
    save(); renderMapMarkers();
  });
  mapMarkers['home'] = homeMarker;

  DB.napBoxes.forEach(box=>{
    if(!hasMapCoordinates(box)) return;
    let sLat = hb.lat, sLng = hb.lng;
    let uplinkName = hb.name;
    if(box.uplinkId){
      const p = DB.napBoxes.find(b=>b.id===box.uplinkId);
      if(p && p.lat && p.lng){ sLat = p.lat; sLng = p.lng; uplinkName = p.name; }
    }
    const dist = getDistanceStr(sLat, sLng, box.lat, box.lng);
    try{
      addMapLine([[Number(sLng),Number(sLat)],[Number(box.lng),Number(box.lat)]], box.color || '#3b82f6', Boolean(box.uplinkId), dist);
    }catch(error){
      console.warn(`Could not draw uplink for NAP box ${box.id}`, error);
    }

    const element = document.createElement('div');
    element.innerHTML = napBoxMarkerMarkup(box.id);
    const markerElement = element.firstElementChild;
    markerElement.dataset.mapTable = 'napBoxes';
    markerElement.dataset.mapId = box.id;
    const m = new mapboxgl.Marker({element:markerElement, draggable:false, anchor:'bottom'})
      .setLngLat([Number(box.lng),Number(box.lat)])
      .addTo(mapInstance);
    markerElement.addEventListener('contextmenu', event=>{
      event.preventDefault();
      event.stopPropagation();
      const point = mapInstance.project(m.getLngLat());
      showMapContextMenuGlobal(point, box.lat, box.lng, {table:'napBoxes',id:box.id});
    });
    m.setPopup(new mapboxgl.Popup({offset:20}).setHTML(`
      <b>${esc(box.id)}</b><br>
      <span style="font-size:11px;color:#94a3b8">${esc(box.label||'')}</span><br>

        Open Splitter
      </button>
    `));
    mapMarkers[box.id] = m;
  });

  DB.clients.forEach(client=>{
    if(client.lat==='' || client.lng==='' || client.lat==null || client.lng==null ||
       !Number.isFinite(Number(client.lat)) || !Number.isFinite(Number(client.lng))) return;
    const lat = Number(client.lat), lng = Number(client.lng);
    const nap = DB.napBoxes.find(box=>box.id===client.napId);
    if(nap && nap.lat!=='' && nap.lng!=='' && Number.isFinite(Number(nap.lat)) && Number.isFinite(Number(nap.lng))){
      const distance = getDistanceStr(nap.lat, nap.lng, lat, lng);
      addMapLine([[Number(nap.lng),Number(nap.lat)],[lng,lat]], '#22c55e', true, `Client drop · ${distance}`);
    }

    const element = document.createElement('div');
    element.className = 'client-house-marker';
    element.textContent = '⌂';
    element.dataset.mapTable = 'clients';
    element.dataset.mapId = client.id;
    const marker = new mapboxgl.Marker({element, draggable:true, anchor:'center'})
      .setLngLat([lng,lat])
      .addTo(mapInstance);
    element.addEventListener('contextmenu', event=>{
      event.preventDefault();
      event.stopPropagation();
      const point = mapInstance.project(marker.getLngLat());
      showMapContextMenuGlobal(point, lat, lng, {table:'clients',id:client.id});
    });
    marker.on('dragend', ()=>{
      const point = marker.getLngLat();
      client.lat = point.lat;
      client.lng = point.lng;
      save(); renderMapMarkers();
    });
    const connection = nap ? `${esc(nap.id)} · port ${esc(client.port||'—')}` : 'Not connected to a NAP';
    marker.setPopup(new mapboxgl.Popup({offset:20}).setHTML(`
      <b>${esc(client.name)}</b><br>
      <span style="font-size:11px;color:#94a3b8">${esc(client.plan||'')}</span><br>
      <span style="font-size:11px;color:#94a3b8">${connection}</span><br><br>

        style="background:#3b82f6;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">

      </button>
    `));
    mapMarkers[`client:${client.id}`] = marker;
  });
}

function moveMapToCoordinates(lat, lng, zoom=18){
  if(!mapInstance) return false;
  if(mapEngine==='leaflet') mapInstance.flyTo([lat,lng], zoom);
  else if(mapEngine==='mapbox') mapInstance.flyTo({center:[lng,lat], zoom});
  else return false;
  return true;
}

async function searchMapLocation(){
  const input = document.getElementById('mapSearchInput');
  const query = input?.value.trim();
  if(!query){ toast('Enter a place, client, NAP box, or coordinates to search'); return; }
  if(!mapInstance){ toast('Map is not ready yet'); return; }

  const coordinates = parseCoordinates(query);
  if(coordinates){
    moveMapToCoordinates(Number(coordinates.lat), Number(coordinates.lng));
    return;
  }

  const normalizedQuery = query.toLowerCase();
  const matches = [
    ...DB.clients.map(client=>({
      record:client,
      table:'clients',
      label:`${client.name||''} ${client.id||''} ${client.pppoe||''} ${client.address||''}`
    })),
    ...DB.napBoxes.map(box=>({
      record:box,
      table:'napBoxes',
      label:`${box.label||''} ${box.id||''} ${box.address||''}`
    })),
    {
      record:DB.settings.homeBase,
      table:'homeBase',
      label:`${DB.settings.homeBase.name||''} Home Base OLT`
    }
  ].filter(item=>item.label.toLowerCase().includes(normalizedQuery));

  if(matches.length===1){
    const match = matches[0].record;
    if(!hasMapCoordinates(match)){
      toast('That record does not have valid map coordinates');
      return;
    }
    moveMapToCoordinates(Number(match.lat), Number(match.lng));
    return;
  }
  if(matches.length>1){
    toast('More than one map record matches. Refine your search.');
    return;
  }
  if(!mapboxAccessToken){
    toast('Place search needs Mapbox configuration. Try coordinates or a saved record instead.');
    return;
  }

  try{
    const url = new URL(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json`);
    url.searchParams.set('limit','1');
    url.searchParams.set('access_token',mapboxAccessToken);
    const response = await fetch(url);
    if(!response.ok) throw new Error(`Place search failed (${response.status})`);
    const result = await response.json();
    const center = result.features?.[0]?.center;
    if(!Array.isArray(center) || center.length<2 ||
       !Number.isFinite(Number(center[0])) || !Number.isFinite(Number(center[1]))){
      toast('No matching place found');
      return;
    }
    moveMapToCoordinates(Number(center[1]), Number(center[0]));
  }catch(error){
    console.error('Map place search failed', error);
    toast('Could not search places. Check your connection and try again.');
  }
}

      ? (c && c.status==='Suspended' ? 'warning' : 'connected')

      ? `<span class="tick ${paid?'paid':'unpaid'}">${paid?'PAID':'UNPAID'}</span>`

function tagEditorMarkup(key, label, values){
  const chips = values.map(value=>`
    <span class="tag-chip" data-tag-value="${esc(value)}">
      <span>${esc(value)}</span>
      <button class="tag-remove" type="button" data-tag-remove aria-label="Remove ${esc(value)}">×</button>
    </span>`).join('');
  return `<label class="field"><span>${esc(label)}</span>
    <div class="tag-editor" data-tag-editor="${esc(key)}">
      ${chips}
      <input type="text" data-tag-input="${esc(key)}" placeholder="Add ${esc(label.toLowerCase())}" autocomplete="off">
      <button class="btn tag-add" type="button" data-tag-add="${esc(key)}" title="Add ${esc(label.toLowerCase())}" aria-label="Add ${esc(label.toLowerCase())}">+</button>
    </div>
  </label>`;
}

function addEditorTag(input){
  const value = input.value.trim();
  if(!value) return;
  const editor = input.closest('[data-tag-editor]');
  const duplicate = [...editor.querySelectorAll('[data-tag-value]')]
    .some(chip=>chip.dataset.tagValue.toLowerCase()===value.toLowerCase());
  input.value = '';
  if(duplicate) return;

  const chip = document.createElement('span');
  chip.className = 'tag-chip';
  chip.dataset.tagValue = value;
  const text = document.createElement('span');
  text.textContent = value;
  const remove = document.createElement('button');
  remove.className = 'tag-remove';
  remove.type = 'button';
  remove.dataset.tagRemove = '';
  remove.setAttribute('aria-label', `Remove ${value}`);
  remove.textContent = '×';
  chip.append(text, remove);
  editor.insertBefore(chip, input);
}

function readEditorTags(key){
  const editor = document.querySelector(`[data-tag-editor="${key}"]`);
  const input = editor.querySelector('[data-tag-input]');
  addEditorTag(input);
  return [...editor.querySelectorAll('[data-tag-value]')].map(chip=>chip.dataset.tagValue);
}

/* ------------------------------ month options ------------------------------ */
function monthOptions(){
  const set = new Set(DB.billing.map(b=>b.month));
  set.add(ym(new Date()));
  for(let i=-6;i<=6;i++){
    const d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth()+i);
    set.add(ym(d));
  }
  return [...set].filter(Boolean).sort().reverse();
}

function openReceipt(paymentId){
  const p = DB.payments.find(x=>String(x.id)===String(paymentId));
  if(!p){ toast('Payment not found'); return; }
  if(!p.receiptNo){ p.receiptNo = nextReceiptNo(); save(); }
  state.currentReceiptId = p.id;

  const c = DB.clients.find(x=>x.id===p.clientId) || {};
  const s = DB.settings;

  const initial = (s.business||'ISP').trim().charAt(0).toUpperCase();
  const dateStr = dateLabel(p.date);
  const timeStr = p.createdAt ? new Date(p.createdAt).toTimeString().slice(0,5) : nowTime();

  // amounts
  const amount = num(p.amount);
  const invoice = DB.billing.find(b=>b.clientId===p.clientId && b.month===p.month);
  const monthDue = invoice ? num(invoice.amountDue) : null;
  // sum all payments for this invoice
  const paidToInvoice = DB.payments
    .filter(x=>x.clientId===p.clientId && x.month===p.month)
    .reduce((s,x)=>s+num(x.amount),0);
  const monthBalance = monthDue!=null ? Math.max(0, monthDue - paidToInvoice) : null;

      ${s.tagline?`<div class="rp-tagline">${esc(s.tagline)}</div>`:''}
      ${s.address?`<div class="rp-addr">${esc(s.address)}</div>`:''}
      ${s.contact?`<div class="rp-contact">${esc(s.contact)}</div>`:''}
      ${s.tin?`<div class="rp-contact">TIN: ${esc(s.tin)}</div>`:''}
