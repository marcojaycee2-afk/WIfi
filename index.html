<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>ISP Manager</title>

<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">⚡ ISP Manager<small id="subBrand">—</small></div>
  <span class="save-status" id="saveStatus" data-state="saving" role="status" aria-live="polite">Opening database…</span>
  <button class="btn" id="btnLogout" title="Sign out">Sign out</button>
  <button class="btn" id="btnBackup" title="Backup">⬇ Backup</button>
  <button class="btn" id="btnRestore" title="Restore">⬆ Restore</button>
  <button class="btn" id="btnMenu" type="button" aria-label="Open menu" aria-controls="tabs" aria-expanded="false">☰</button>
</header>

<nav class="tabs" id="tabs" aria-label="Main navigation"></nav>
<main id="view"></main>

<!-- general modal -->
<div class="backdrop" id="backdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
</div>

<!-- receipt modal -->
<div class="receipt-backdrop" id="receiptBackdrop">
  <div class="receipt-shell" role="dialog" aria-modal="true" aria-label="Payment receipt">
    <div class="receipt-actions no-print">
      <button class="btn primary" id="btnPrintRcpt">🖨 Print</button>
      <button class="btn" id="btnCopyRcpt">📋 Copy Text</button>
      <button class="btn" id="btnShareRcpt">🔗 Share</button>
      <button class="btn" data-act="closeReceipt" aria-label="Close receipt">✕ Close</button>
    </div>
    <div id="receiptPaperMount"></div>
  </div>
</div>

<!-- confirm / alert dialog -->
<div class="backdrop dialog-backdrop" id="dialogBackdrop">
  <div class="modal dialog" id="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogMessage"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" accept="application/json" hidden>

<script src="/billing.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/pages.js"></script>
<script src="/assets/js/naps.js"></script>
<script src="/assets/js/receipt.js"></script>
<script src="/assets/js/forms.js"></script>
<script src="/assets/js/events.js"></script>
</body>
</html>
