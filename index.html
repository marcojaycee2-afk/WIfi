    <div class="rp-title">OFFICIAL RECEIPT</div>
    <div class="rp-divider solid">========================================</div>

    <div class="rp-row"><span>Receipt No:</span><span>${esc(p.receiptNo)}</span></div>
    <div class="rp-row"><span>Date:</span><span>${esc(dateStr)}</span></div>
    <div class="rp-row"><span>Time:</span><span>${esc(timeStr)}</span></div>

    <div class="rp-divider">----------------------------------------</div>

    <div class="rp-label">RECEIVED FROM</div>
    <div class="rp-name">${esc(c.name||p.clientId)}</div>
    <div class="rp-row"><span>Client ID:</span><span>${esc(c.id||p.clientId)}</span></div>
    ${c.contact?`<div class="rp-row"><span>Contact:</span><span>${esc(c.contact)}</span></div>`:''}
    ${(c.barangay||c.city)?`<div class="rp-row"><span>Address:</span><span>${esc([c.barangay,c.city,c.province].filter(Boolean).join(', '))}</span></div>`:''}

    <div class="rp-divider">----------------------------------------</div>

    <div class="rp-label">FOR</div>
    <div class="rp-row"><span>Billing Month:</span><span>${esc(monthLabel(p.month))}</span></div>
    ${c.plan?`<div class="rp-row"><span>Plan:</span><span>${esc(c.plan)}</span></div>`:''}
    ${monthDue!=null?`<div class="rp-row"><span>Amount Due:</span><span>${peso(monthDue)}</span></div>`:''}

    <div class="rp-divider">----------------------------------------</div>

    <div class="rp-row big"><span>AMOUNT PAID:</span><span>${peso(amount)}</span></div>

    <div class="rp-row"><span>Method:</span><span>${esc(p.method||'—')}</span></div>
    ${p.ref?`<div class="rp-row"><span>Reference No:</span><span>${esc(p.ref)}</span></div>`:''}
    ${monthBalance!=null?`<div class="rp-row"><span>Invoice Balance:</span><span>${monthBalance>0?peso(monthBalance):'FULLY PAID'}</span></div>`:''}
    <div class="rp-row"><span>Received By:</span><span>${esc(p.receivedBy||'Admin')}</span></div>

  document.getElementById('receiptBackdrop').classList.remove('open');
  document.getElementById('receiptPaperMount').innerHTML = '';
  document.body.style.overflow = '';

}

function receiptPlainText(){
  const p = DB.payments.find(x=>String(x.id)===String(state.currentReceiptId));
  if(!p) return '';
  const c = DB.clients.find(x=>x.id===p.clientId) || {};
  const s = DB.settings;
  const line = '----------------------------------------';
  const dline = '========================================';

  return [
    s.business,
    s.tagline||'',
    s.address||'',
    s.contact||'',
    dline,
    'OFFICIAL RECEIPT',
    dline,
    `Receipt No: ${p.receiptNo}`,
    `Date: ${dateLabel(p.date)}`,
    `Time: ${nowTime()}`,
    line,
    'RECEIVED FROM',
    c.name || p.clientId,
    `Client ID: ${c.id || p.clientId}`,
    c.contact?`Contact: ${c.contact}`:'',
    c.barangay?`Address: ${[c.barangay,c.city,c.province].filter(Boolean).join(', ')}`:'',
    line,
    'FOR',
    `Billing Month: ${monthLabel(p.month)}`,
    c.plan?`Plan: ${c.plan}`:'',
    line,
    `AMOUNT PAID: ${peso(p.amount)}`,
    `Method: ${p.method||'—'}`,
    p.ref?`Reference: ${p.ref}`:'',
    `Received By: ${p.receivedBy||'Admin'}`,
    dline,
    'THANK YOU!',
    'Keep this receipt for your records.',
    dline
  ].filter(Boolean).join('\n');
}

async function copyReceiptText(){
  const txt = receiptPlainText();
  try{
    await navigator.clipboard.writeText(txt);
    toast('Receipt copied to clipboard');
  }catch(e){
    // fallback
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    toast('Receipt copied to clipboard');
  }
}

async function shareReceipt(){
  const p = DB.payments.find(x=>String(x.id)===String(state.currentReceiptId));
  if(!p) return;
  const c = DB.clients.find(x=>x.id===p.clientId) || {};
  const s = DB.settings;
  const text = `*${s.business}*\nOfficial Receipt ${p.receiptNo}\n\nReceived from: ${c.name||p.clientId}\nAmount: ${peso(p.amount)}\nFor: ${monthLabel(p.month)}\nMethod: ${p.method}\n${p.ref?'Ref: '+p.ref+'\n':''}Date: ${dateLabel(p.date)}\n\nThank you!`;

  if(navigator.share){
    try{
      await navigator.share({ title:`Receipt ${p.receiptNo}`, text });
      return;
    }catch(e){ /* fallthrough */ }
  }
  // fallback: copy
  try{
    await navigator.clipboard.writeText(text);
    toast('Receipt copied — paste to send');
  }catch(e){
    toast('Sharing not supported');
  }
}

function openForm(table, id, initialValues={}){
  const schema = SCHEMAS[table];
  const isNew = !id;
  const row = isNew ? {} : DB[table].find(r=>String(r.id)===String(id));
  if(!isNew && !row){ toast('Record not found'); return; }

  const data = isNew ? initialValues : {...row, ...initialValues};

  const fieldsHtml = schema.fields.map(f=>{
    let val = data[f.k];
    if((val===undefined || val==='') && isNew && f.def) val = f.def();
    if(val===undefined || val===null) val = '';

    let input;
    if(f.t==='select'){
      const opts = f.opts ? f.opts() : [];
      if(table==='napBoxes' && f.k==='splitter'){
        val = normalizeSplitterChoice(val, data.totalPorts);
        return `<fieldset class="field">
          <legend style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px">${esc(f.l)}${f.req?' *':''}</legend>
          <div class="splitter-choice-group" role="radiogroup" aria-label="Total ports">
            ${opts.map((option,index)=>`<label class="splitter-choice">
              <input type="radio" name="${f.k}" value="${esc(option)}" ${String(val)===String(option)?'checked':''} ${f.req&&index===0?'required':''}>
              <span>${esc(option)}</span>
            </label>`).join('')}
          </div>
        </fieldset>`;
      }
      if(f.k==='plan'){
        const customPlanValue = '__custom_plan__';
        const planOptions = opts.filter(o=>String(o).toLowerCase()!=='custom');
        const hasPlanOption = planOptions.some(o=>String(o)===String(val));
        const selectedPlan = hasPlanOption ? val : (val ? customPlanValue : '');
        const customSpeed = !hasPlanOption && val
          ? (String(val).match(/^(\d+(?:\.\d+)?)\s*mbps$/i)||[])[1] || ''
          : '';
        input = `<select name="${f.k}" ${f.req?'required':''}>
          <option value="">— select —</option>
          ${planOptions.map(o=>`<option value="${esc(o)}" ${String(selectedPlan)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}
          <option value="${customPlanValue}" ${selectedPlan===customPlanValue?'selected':''}>Custom</option>
        </select>`;
        const showCustomSpeed = selectedPlan===customPlanValue;
        return `<div class="field"><span>${esc(f.l)}${f.req?' *':''}</span>${input}
          <label class="field custom-speed-field" data-custom-speed-field style="display:${showCustomSpeed?'block':'none'}">
            <span>Enter custom speed (Mbps)</span>
            <input name="customMbps" type="number" min="0.01" step="any" inputmode="decimal"
              placeholder="e.g. 75" value="${esc(customSpeed)}" ${showCustomSpeed?'required':''}>
            <small class="field-hint">Type the speed in Mbps, for example 75.</small>
          </label>
          ${f.hint?`<small class="field-hint">${esc(f.hint)}</small>`:''}</div>`;
      }
      input = `<select name="${f.k}" ${f.req?'required':''}>
        <option value="">— select —</option>
        ${opts.map(o=>`<option value="${esc(o)}" ${String(val)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}
      </select>`;
    } else if(f.t==='client'){
      input = `<select name="${f.k}" ${f.req?'required':''}>
        <option value="">— select client —</option>
        ${DB.clients.map(c=>`<option value="${esc(c.id)}" ${String(val)===String(c.id)?'selected':''}>${esc(c.id)} — ${esc(c.name)}</option>`).join('')}
      </select>`;
    } else if(f.t==='textarea'){
      input = `<textarea name="${f.k}" rows="2">${esc(val)}</textarea>`;
    } else if(f.t==='color'){
      input = `<input name="${f.k}" type="color" value="${esc(val)||'#3b82f6'}">`;
    } else {
      input = `<input name="${f.k}" type="${f.t}" value="${esc(val)}"
        ${f.req?'required':''} ${f.step?`step="${f.step}"`:''}>`;
    }
    return `<label class="field"><span>${esc(f.l)}${f.req?' *':''}</span>${input}${f.hint?`<small class="field-hint">${esc(f.hint)}</small>`:''}</label>`;
  }).join('');

  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div class="modal-head">
      <h2>${isNew?'Add':'Edit'} ${esc(schema.title)}</h2>
      <button class="btn sm" data-act="closeModal">✕</button>
    </div>
    <form id="modalForm">${fieldsHtml}
      <div class="modal-actions">
        <button type="button" class="btn" data-act="closeModal">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>`;

  document.getElementById('backdrop').classList.add('open');

  document.getElementById('modalForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const obj = {};
    schema.fields.forEach(f=>{
      let v = fd.get(f.k);
      if(v===null) v = '';
      if(f.t==='number' && v!=='') v = Number(v);
      obj[f.k] = v;
    });

    if(table==='napBoxes'){
      obj.splitter = normalizeSplitterChoice(obj.splitter, obj.totalPorts);
      obj.totalPorts = splitterPortCount(obj.splitter);
    }

    if(schema.fields.some(f=>f.k==='plan')){
      const plan = e.target.elements.namedItem('plan');
      if(plan && plan.value==='__custom_plan__'){
        const customMbps = Number(e.target.elements.namedItem('customMbps').value);
        if(!Number.isFinite(customMbps) || customMbps<=0){
          toast('Enter a valid custom speed in Mbps'); return;
        }
        obj.plan = `${customMbps} Mbps`;
      }
    }

    const old = isNew ? null : {...row};
    if(table==='napBoxes' && old && obj.totalPorts<Number(old.totalPorts)){
      const occupiedPort = DB.napPorts.find(port=>
        port.napId===old.id && Number(port.port)>obj.totalPorts &&
        (port.clientId || port.status!=='Free')
      );
      const assignedClient = DB.clients.find(client=>
        client.napId===old.id && Number(client.port)>obj.totalPorts
      );
      const portToKeep = occupiedPort?.port || assignedClient?.port;
      if(portToKeep){
        toast(`Cannot reduce ports while port ${portToKeep} is assigned or in use`);
        return;
      }
    }
    const previousState = JSON.parse(JSON.stringify(DB));

    if(table==='clients'){
      if(obj.lat!=='' || obj.lng!==''){
        const lat = Number(obj.lat), lng = Number(obj.lng);
        if(obj.lat==='' || obj.lng==='' || !Number.isFinite(lat) || !Number.isFinite(lng) ||
           lat < -90 || lat > 90 || lng < -180 || lng > 180){
          toast('Enter valid latitude and longitude for the house'); return;
        }
      }
      const portError = clientPortError(obj, old ? old.id : obj.id);
      if(portError){ toast(portError); return; }
      if(obj.napId && obj.port){
        const targetPort = DB.napPorts.find(p=>p.napId===obj.napId && Number(p.port)===Number(obj.port));
        if(targetPort && ['Faulty','Reserved'].includes(targetPort.status)){
          toast('Choose a free NAP port'); return;
        }
      }
    }

    if(isNew){
      if(DB[table].some(r=>String(r.id)===String(obj.id))){
        toast('ID already exists'); return;
      }
      // stamp createdAt for receipts
      if(table==='payments'){
        obj.createdAt = new Date().toISOString();
        if(!obj.receiptNo) obj.receiptNo = nextReceiptNo();
      }
      DB[table].push(obj);
    } else {
      const idx = DB[table].findIndex(r=>String(r.id)===String(id));
      // preserve createdAt
      if(table==='payments' && row.createdAt && !obj.createdAt) obj.createdAt = row.createdAt;
      DB[table][idx] = obj;
    }

    if(table==='clients') syncClientPort(obj, old);
    if(table==='napBoxes') ensurePorts(obj);

    const persisted = await save();
    if(!persisted){
      DB = previousState;
      toast('Could not save this record. Please check your connection and try again.');
      return;
    }
    closeModal(); render();
    toast(isNew ? 'Added' : 'Updated');

    // offer to open receipt if new payment
    if(isNew && table==='payments'){
      setTimeout(()=>openReceipt(obj.id), 200);
    }
  });
}

    p.fiberColor = newStatus==='Free' ? '' : (fiberColor || oldFiberColor || '');

    save(); closeModal(); render();

/* ------------------------------ side effects ------------------------------ */
function syncClientPort(client, old){
  if(old && (old.napId!==client.napId || String(old.port)!==String(client.port))){
    const oldPort = DB.napPorts.find(p=>
      p.napId===old.napId && String(p.port)===String(old.port) && p.clientId===client.id
    );
    if(oldPort){ oldPort.clientId=''; oldPort.status='Free'; }
  }
  if(client.napId && client.port){
    let targetPort = DB.napPorts.find(p=>
      p.napId===client.napId && Number(p.port)===Number(client.port)
    );
    if(!targetPort){
      targetPort = {id:`NP-${client.napId}-${client.port}`, napId:client.napId,
        port:Number(client.port), clientId:'', status:'Free', notes:'', fiberColor:''};
      DB.napPorts.push(targetPort);
    }
    targetPort.clientId=client.id; targetPort.status='Used';
  }
}

function clientPortError(client, excludeClientId){
  if(!client.napId && !client.port) return '';
  if(!client.napId || !client.port) return 'Choose both a NAP box and port, or leave both empty';
  const box = DB.napBoxes.find(b=>b.id===client.napId);
  const port = Number(client.port);
  if(!box || !Number.isInteger(port) || port<1 || port>num(box.totalPorts)){
    return 'Choose a valid port on the selected NAP box';
  }
  const otherClient = DB.clients.find(c=>c.id!==excludeClientId && c.napId===client.napId && Number(c.port)===port);
  if(otherClient) return `Port ${port} is already assigned to ${otherClient.name}`;
  const portRecord = DB.napPorts.find(p=>p.napId===client.napId && Number(p.port)===port && p.clientId && p.clientId!==excludeClientId);
  if(portRecord){
    const owner = DB.clients.find(c=>c.id===portRecord.clientId);
    return `Port ${port} is already assigned${owner?` to ${owner.name}`:''}`;
  }
  const portStatus = DB.napPorts.find(p=>p.napId===client.napId && Number(p.port)===port);
  if(portStatus && portStatus.clientId!==excludeClientId && portStatus.status!=='Free'){
    return `Port ${port} is ${portStatus.status.toLowerCase()} and cannot be assigned`;
  }
  return '';
}

function ensurePorts(box){
  for(let i=1;i<=num(box.totalPorts);i++){
    if(!DB.napPorts.find(p=>p.napId===box.id && Number(p.port)===i)){
      DB.napPorts.push({id:`NP-${box.id}-${i}`, napId:box.id, port:i, clientId:'', status:'Free', notes:'', fiberColor:''});
    }
  }
  DB.napPorts = DB.napPorts.filter(p=>p.napId!==box.id || Number(p.port)<=num(box.totalPorts));
}

function generatedInvoiceDueDate(client, month){
  const match = String(month||'').match(/^(\d{4})-(\d{2})$/);
  if(!match) return null;
  const billingYear = Number(match[1]);
  const billingMonth = Number(match[2]);
  if(billingMonth<1 || billingMonth>12) return null;

  const installed = String(client.installed||'');
  const installationMatch = installed.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  const hasValidInstallationDate = installationMatch &&
    iso(new Date(`${installed}T00:00:00`))===installed;
  const invoiceDueDay = hasValidInstallationDate
    ? Number(installationMatch[3])
    : Number(DB.settings.dueDay)||5;
  const lastDayOfMonth = new Date(billingYear, billingMonth, 0).getDate();
  let dueDate = iso(new Date(
    billingYear, billingMonth-1, Math.min(invoiceDueDay, lastDayOfMonth)
  ));
  if(hasValidInstallationDate && dueDate<=installed){
    const dayAfterInstallation = new Date(`${installed}T00:00:00`);
    dayAfterInstallation.setDate(dayAfterInstallation.getDate()+1);
    dueDate = iso(dayAfterInstallation);
  }
  return dueDate;
}

function updateCurrentGeneratedInvoiceDueDates(){
  const month = ym(new Date());
  let updated = 0;
  (DB.billing||[]).forEach(invoice=>{
    if(invoice.month!==month || invoice.id!==`INV-${month}-${invoice.clientId}`) return;
    const client = (DB.clients||[]).find(item=>item.id===invoice.clientId);
    if(!client) return;
    const dueDate = generatedInvoiceDueDate(client, month);
    if(dueDate && invoice.dueDate!==dueDate){
      invoice.dueDate = dueDate;
      updated++;
    }
  });
  return updated;
}

async function generateInvoices(month){
  if(!/^\d{4}-\d{2}$/.test(String(month||'')) ||
     !generatedInvoiceDueDate({}, month)){
    toast('Choose a valid billing month');
    return;
  }
  let added = 0;
  let updated = 0;
  DB.clients.filter(c=>c.status!=='Disconnected').forEach(c=>{
    const dueDate = generatedInvoiceDueDate(c, month);
    if(!dueDate) return;
    const invoiceId = `INV-${month}-${c.id}`;
    const existing = DB.billing.find(b=>b.clientId===c.id && b.month===month);
    if(existing){
      if(existing.id===invoiceId && existing.dueDate!==dueDate){
        existing.dueDate = dueDate;
        updated++;
      }
    }else{
      DB.billing.push({
        id:invoiceId, month, clientId:c.id,
        dueDate, amountDue:num(c.rate), remarks:''
      });
      added++;
    }
  });
  save();
  toast(added || updated
    ? `Generated ${added} invoice(s)${updated?` · updated ${updated} due date(s)`:''}`
    : 'All invoices already exist');
  render();
}

function deleteRecord(table, id){
  if(!DB[table] || !DB[table].some(record=>String(record.id)===String(id))){
    toast('Record not found');
    return;
  }
  if(!confirm(`Delete ${id}? This cannot be undone.`)) return;
  DB[table] = DB[table].filter(record=>String(record.id)!==String(id));
  if(table==='clients'){
    DB.napPorts.forEach(port=>{
      if(port.clientId===id){ port.clientId=''; port.status='Free'; }
    });
  }
  if(table==='napBoxes'){
    DB.napPorts = DB.napPorts.filter(port=>port.napId!==id);
    DB.clients.forEach(client=>{
      if(client.napId===id){ client.napId=''; client.port=''; }
    });
    DB.napBoxes.forEach(box=>{ if(box.uplinkId===id) box.uplinkId=''; });
  }
  save(); render(); toast('Deleted');
}

   EVENTS

window.addEventListener('storage', e=>{
  if(e.key!==KEY || !e.newValue || !DB) return;
  try{
    const updated = JSON.parse(e.newValue);
    const collections = ['clients','billing','payments','napBoxes','napPorts','complaints','installs','inventory'];
    if(!updated || collections.some(key=>!Array.isArray(updated[key])) || !updated.settings){
      console.warn('Ignored an invalid cross-tab data update');
      return;
    }
    DB = updated;
    document.getElementById('subBrand').textContent = DB.settings.business || 'My ISP';
    if(state.tab==='dashboard') render();
  }catch(error){
    console.warn('Could not apply a cross-tab data update', error);
  }
});

document.addEventListener('click', async e=>{
  const tableScrollButton = e.target.closest('[data-table-scroll]');
  if(tableScrollButton){
    const controls = tableScrollButton.closest('.table-scroll-controls');
    const wrapper = controls && controls.previousElementSibling;
    if(wrapper && wrapper.classList.contains('tw')){
      wrapper.scrollBy({
        left:Number(tableScrollButton.dataset.tableScroll)*Math.max(160,wrapper.clientWidth*0.75),
        behavior:'smooth'
      });
    }
    return;
  }

  const menuToggle = e.target.closest('#btnMenu');
  if(menuToggle){
    if(menuToggle._suppressClick){
      menuToggle._suppressClick = false;
      clearTimeout(menuToggle._suppressClickTimer);
      return;
    }
    if(menuToggle.classList.contains('menu-docked')){
      menuToggle.classList.remove('menu-docked');
      menuToggle.setAttribute('aria-label','Open menu');
      menuToggle.title='Open menu';
      return;
    }
    const menu = document.getElementById('tabs');
    const isOpen = menu.classList.toggle('mobile-open');
    menuToggle.textContent = isOpen ? '×' : '☰';
    menuToggle.setAttribute('aria-expanded', String(isOpen));
    menuToggle.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
    return;
  }

  const mobileMenu = document.getElementById('tabs');
  if(e.target===mobileMenu && mobileMenu.classList.contains('mobile-open')){
    mobileMenu.classList.remove('mobile-open');
    const menuToggleButton = document.getElementById('btnMenu');
    menuToggleButton.textContent = '☰';
    menuToggleButton.setAttribute('aria-expanded','false');
    menuToggleButton.setAttribute('aria-label','Open menu');
    return;
  }

  if(e.target.closest('[data-mobile-logout]')){
    document.getElementById('btnLogout').click();
    return;
  }

  const removeTag = e.target.closest('[data-tag-remove]');
  if(removeTag){ removeTag.closest('[data-tag-value]').remove(); return; }

  const addTag = e.target.closest('[data-tag-add]');
  if(addTag){
    const input = document.querySelector(`[data-tag-input="${addTag.dataset.tagAdd}"]`);
    addEditorTag(input);
    input.focus();
    return;
  }

  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){
    document.getElementById('tabs').classList.remove('mobile-open');
    const menuToggleButton = document.getElementById('btnMenu');
    menuToggleButton.textContent = '☰';
    menuToggleButton.setAttribute('aria-expanded','false');
    menuToggleButton.setAttribute('aria-label','Open menu');
    state.mapPlaceClient=false; state.mapPlaceNap=false; state.tab = tabBtn.dataset.tab; state.search=''; render(); return;
  }

  const napViewBtn = e.target.closest('[data-napview]');
  if(napViewBtn){
    state.mapPlaceClient = false;
    state.mapPlaceNap = false;
    state.napView = napViewBtn.dataset.napview;
    render();
    return;
  }

  const splitterBtn = e.target.closest('[data-act="viewSplitter"]');
  if(splitterBtn){
    state.napView = 'splitter';
    state.selectedNapId = splitterBtn.dataset.id;
    render();
    return;
  }

  const portCell = e.target.closest('[data-act="openPort"]');
  if(portCell){
    openPortModal(portCell.dataset.napid, Number(portCell.dataset.port));
    return;
  }

  const act = e.target.closest('[data-act]');
  if(!act) return;
  const a = act.dataset.act;

  if(a==='connectClient'){
    openClientPortModal(act.dataset.id);
    return;
  }
  if(a==='goNaps'){
    closeModal();
    state.tab = 'naps';
    state.search = '';
    render();
    return;
  }
  if(a==='continueHouse'){
    const clientId = document.getElementById('houseClientPicker').value;
    const coordinates = state.pendingClientHouse;
    state.pendingClientHouse = null;
    if(coordinates) openForm('clients', clientId, coordinates);
    return;
  }
  if(a==='newHouseClient'){
    const coordinates = state.pendingClientHouse;
    state.pendingClientHouse = null;
    if(coordinates) openForm('clients', null, coordinates);
    return;
  }
  if(a==='placeNapCenter'){
    if(!mapInstance){ toast('Map is not ready yet'); return; }
    state.mapPlaceNap = true;
    const pin = document.getElementById('mapCenterPin');
    const controls = document.getElementById('mapCenterConfirm');
    if(pin) pin.hidden = false;
    if(controls) controls.hidden = false;
    toast('Pan the map beneath the pin, then tap Place here');
    return;
  }
  if(a==='searchMap'){
    searchMapLocation();
    return;
  }
  if(a==='pasteNapCoordinates'){
    const input = document.getElementById('napCoordinatesInput');
    if(!navigator.clipboard?.readText){
      input?.focus();
      toast('Clipboard access unavailable. Paste coordinates into the field manually.');
      return;
    }
    try{
      const text = await navigator.clipboard.readText();
      if(!text.trim()){
        toast('Clipboard is empty');
        return;
      }
      input.value = text.trim();
      input.focus();
      toast('Coordinates pasted. Tap “Use pasted location” to continue.');
    }catch(error){
      console.error('Could not read coordinates from clipboard', error);
      input?.focus();
      toast('Could not read clipboard. Paste coordinates into the field manually.');
    }
    return;
  }
  if(a==='placeNapCoordinates'){
    const coordinates = parseCoordinates(document.getElementById('napCoordinatesInput')?.value);
    if(!coordinates){
      toast('Paste valid latitude, longitude coordinates (for example: 14.998828, 120.891659)');
      return;
    }
    state.mapPlaceNap = false;
    openForm('napBoxes', null, coordinates);
    return;
  }
  if(a==='cancelNapCenter'){
    state.mapPlaceNap = false;
    const pin = document.getElementById('mapCenterPin');
    const controls = document.getElementById('mapCenterConfirm');
    if(pin) pin.hidden = true;
    if(controls) controls.hidden = true;
    return;
  }
  if(a==='confirmNapCenter'){
    if(!mapInstance){ toast('Map is not ready yet'); return; }
    const center = mapInstance.getCenter();
    state.mapPlaceNap = false;
    const pin = document.getElementById('mapCenterPin');
    const controls = document.getElementById('mapCenterConfirm');
    if(pin) pin.hidden = true;
    if(controls) controls.hidden = true;
    openForm('napBoxes', null, {
      lat:Number(center.lat).toFixed(6),
      lng:Number(center.lng).toFixed(6)
    });

    return;
  }
  if(a==='placeNapBoxAtMap' || a==='placeClientAtMap'){
    const coordinates = state.mapContextLocation;
    const menu = document.getElementById('mapContextMenu');
    if(menu) menu.hidden = true;
    state.mapContextLocation = null;
    if(!coordinates) return;
    state.mapPlaceNap = false;
    if(a==='placeNapBoxAtMap') openForm('napBoxes', null, coordinates);
    else openClientHouseForm(coordinates.lat, coordinates.lng);
    return;
  }
  if(a==='deleteMapTarget'){
    const target = state.mapContextTarget;
    hideMapContextMenuGlobal();
    if(target && ['clients','napBoxes'].includes(target.table)){
      deleteRecord(target.table, target.id);
    }
    return;
  }
  if(a==='focusNapMap'){
    focusNapBoxOnMap(act.dataset.id);
    return;
  }
  if(a==='addClientHouse'){
    state.mapPlaceNap = false;
    state.mapPlaceClient = true;
    state.napView = 'map';
    render();
    toast('Tap the map to place the house');
    return;
  }
  if(a==='add'){ openForm(act.dataset.table); return; }
  if(a==='edit'){ openForm(act.dataset.table, act.dataset.id); return; }
  if(a==='payInvoice'){ openInvoicePayment(act.dataset.id); return; }
  if(a==='closeModal'){ closeModal(); return; }
  if(a==='closeReceipt'){ closeReceipt(); return; }
  if(a==='generate'){ generateInvoices(state.month); return; }
  if(a==='receipt'){ openReceipt(act.dataset.id); return; }

  if(a==='del'){
    deleteRecord(act.dataset.table, act.dataset.id);
    return;
  }

  if(a==='saveSettings'){
    DB.settings.business = document.getElementById('setBusiness').value.trim() || 'My ISP';
    DB.settings.tagline = document.getElementById('setTagline').value.trim();
    DB.settings.address = document.getElementById('setAddress').value.trim();
    DB.settings.contact = document.getElementById('setContact').value.trim();
    DB.settings.tin = document.getElementById('setTin').value.trim();
    const plans = readEditorTags('plans');
    const methods = readEditorTags('methods');
    if(!plans.length || !methods.length){ toast('Add at least one plan and payment method'); return; }
    DB.settings.plans = plans;
    DB.settings.methods = methods;
    DB.settings.dueDay = Math.min(28, Math.max(1, num(document.getElementById('setDueDay').value)||5));
    document.getElementById('subBrand').textContent = DB.settings.business;
    save(); toast('Settings saved'); render();
    return;
  }
  if(a==='enablePushNotifications'){
    await enablePushNotifications();
    return;
  }
  if(a==='testBrowserNotification'){
    await testBrowserNotification();
    return;
  }
  if(a==='disablePushNotifications'){
    await disablePushNotifications();
    return;
  }

  if(a==='saveHome'){
    DB.settings.homeBase.name = document.getElementById('setHomeName').value.trim() || 'Home Base / OLT';
    DB.settings.homeBase.lat = num(document.getElementById('setHomeLat').value) || DB.settings.homeBase.lat;
    DB.settings.homeBase.lng = num(document.getElementById('setHomeLng').value) || DB.settings.homeBase.lng;
    save(); toast('Home Base saved'); render();
    return;
  }

  if(a==='resetDemo'){
    if(!confirm('Restore the imported PPPoE list? Your current records will be replaced.')) return;
    DB = seed(); save(); state.month = ym(new Date()); render(); toast('Demo data restored');
    return;
  }

  if(a==='wipe'){
    if(!confirm('Erase ALL data? This cannot be undone.')) return;
    if(!confirm('Are you absolutely sure?')) return;
    DB = {
      clients:[], billing:[], payments:[], napBoxes:[], napPorts:[],
      complaints:[], installs:[], inventory:[],
      settings:{
        business:'My ISP', tagline:'Fiber Internet Service Provider',
        address:'', contact:'', tin:'',
        plans:['35 Mbps','50 Mbps','100 Mbps'], pricingDefaultsVersion:1,
        methods:['Cash','GCash','Maya','Bank Transfer'],
        dueDay:5, homeBase:{name:'Home Base / OLT', lat:14.1230, lng:121.1230}
      }
    };
    save(); render(); toast('All data erased');
    return;
  }
});

const floatingMenuButton = document.getElementById('btnMenu');
let menuHoldTimer = null;
let menuHoldTriggered = false;
floatingMenuButton.addEventListener('pointerdown', event=>{
  if(event.pointerType==='mouse' && event.button!==0) return;
  clearTimeout(menuHoldTimer);
  menuHoldTriggered = false;
  menuHoldTimer = setTimeout(()=>{
    if(floatingMenuButton.getAttribute('aria-expanded')==='true') return;
    menuHoldTriggered = true;
    floatingMenuButton.classList.toggle('menu-docked');
    const docked = floatingMenuButton.classList.contains('menu-docked');
    floatingMenuButton.setAttribute('aria-label',docked?'Show menu button':'Open menu');
    floatingMenuButton.title = docked ? 'Tap to show menu button' : 'Open menu';
  },550);
});
const finishMenuHold = ()=>{
  clearTimeout(menuHoldTimer);
  menuHoldTimer = null;
  if(menuHoldTriggered){
    floatingMenuButton._suppressClick = true;
    clearTimeout(floatingMenuButton._suppressClickTimer);
    floatingMenuButton._suppressClickTimer = setTimeout(()=>{
      floatingMenuButton._suppressClick = false;
    },300);
    menuHoldTriggered = false;
  }
};
floatingMenuButton.addEventListener('pointerup',finishMenuHold);
floatingMenuButton.addEventListener('pointercancel',finishMenuHold);
floatingMenuButton.addEventListener('pointerleave',finishMenuHold);

  if(e.target.name==='rate' && e.target.form?.id==='modalForm'){

/* ------------------------------ backup / restore ------------------------------ */
function download(filename, text, type='application/json'){
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function doBackup(){
  const stamp = todayISO();
  download(`isp-backup-${stamp}.json`, JSON.stringify(DB, null, 2));
  toast('Backup downloaded');
}

function toCSV(rows, cols){
  const esc2 = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const head = cols.map(c=>esc2(c.label)).join(',');
  const body = rows.map(r=>cols.map(c=>esc2(r[c.key])).join(',')).join('\n');
  return head + '\n' + body;
}

document.getElementById('btnBackup').onclick = doBackup;
document.getElementById('btnRestore').onclick = ()=>document.getElementById('fileInput').click();
document.getElementById('btnLogout').onclick = async ()=>{
  try{
    const response = await fetch('/api/logout', {method:'POST'});
    if(!response.ok) throw new Error(`Sign out failed (${response.status})`);
    window.location.replace('/login');
  }catch(error){
    console.error(error);
    toast('Could not sign out. Please try again.');
  }
};

document.addEventListener('click', e=>{
  if(e.target.id==='btnBackup2') doBackup();
  if(e.target.id==='btnRestore2') document.getElementById('fileInput').click();
  if(e.target.id==='btnCsv'){
    const csv = toCSV(DB.clients, [
      {label:'Client ID', key:'id'},
      {label:'Full Name', key:'name'},
      {label:'Address/Barangay', key:'barangay'},
      {label:'City', key:'city'},
      {label:'Province', key:'province'},
      {label:'Contact', key:'contact'},
      {label:'Plan', key:'plan'},
      {label:'Monthly Rate', key:'rate'},
      {label:'Installation Date', key:'installed'},
      {label:'NAP Box', key:'napId'},
      {label:'NAP Port', key:'port'},
      {label:'ONU Serial', key:'onu'},
      {label:'MAC', key:'mac'},
      {label:'PPPoE', key:'pppoe'},
      {label:'Status', key:'status'},
      {label:'Notes', key:'notes'},
    ]);
    download(`clients-${todayISO()}.csv`, csv, 'text/csv');
    toast('CSV exported');
  }
});

document.getElementById('fileInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.clients || !Array.isArray(data.clients)) throw new Error('Invalid file');
      if(!confirm('Replace all current data with this backup?')) return;
      DB = data;
      DB.settings = DB.settings || {};
      DB.settings.plans = DB.settings.plans || [];
      DB.settings.methods = DB.settings.methods || [];
      DB.settings.dueDay = DB.settings.dueDay || 5;
      DB.settings.business = DB.settings.business || 'My ISP';
      if(!DB.settings.homeBase) DB.settings.homeBase = {name:'Home Base / OLT', lat:14.1230, lng:121.1230};
      correctLegacy600Pricing();
      migratePlanPricing();
      addDefaultPricingPlans();
      (DB.payments||[]).forEach(p=>{ if(!p.receiptNo) p.receiptNo = nextReceiptNo(); });
      updateCurrentGeneratedInvoiceDueDates();
      save();
      document.getElementById('subBrand').textContent = DB.settings.business;
      render();
      toast('Backup restored');
    }catch(err){
      alert('Could not read that file. Make sure it is a valid ISP Manager backup.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});
