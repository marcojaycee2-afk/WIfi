<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Sign in · NAPBOX ISP Manager</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1220;
      color: #e8edf7;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0, #162647 0, #0b1220 58%);
    }
    .card {
      width: min(100%, 410px);
      padding: 34px;
      border: 1px solid #26324a;
      border-radius: 18px;
      background: #141d31;
      box-shadow: 0 24px 70px #0006;
    }
    .brand { margin: 0 0 8px; color: #60a5fa; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 26px; letter-spacing: -.03em; }
    .intro { margin: 10px 0 26px; color: #8896b0; font-size: 14px; }
    #googleButton { display: flex; justify-content: center; min-height: 44px; }
    .error { min-height: 20px; margin: 12px 0 0; color: #fca5a5; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <p class="brand">NAPBOX · ISP Manager</p>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to manage your ISP workspace.</p>
    <div id="googleButton"></div>
    <p class="error" id="errorMessage" role="alert" aria-live="polite">Loading Google sign-in…</p>
  </main>
  <script>
    const errorMessage = document.getElementById('errorMessage');

    async function handleCredentialResponse(response) {
      errorMessage.textContent = '';
      try {
        const result = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        if (result.ok) {
          window.location.replace('/');
          return;
        }
        const body = await result.json();
        errorMessage.textContent = body.error || 'Google sign-in failed. Please try again.';
      } catch {
        errorMessage.textContent = 'Unable to reach the server. Please try again.';
      }
    }

    async function initializeGoogleSignIn() {
      try {
        const configResponse = await fetch('/api/auth/config');
        if (!configResponse.ok) throw new Error('Could not load sign-in configuration');
        const { googleClientId } = await configResponse.json();
        if (!googleClientId) throw new Error('Google sign-in is not configured on the server');

        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://accounts.google.com/gsi/client';
          script.async = true;
          script.defer = true;
          script.onload = resolve;
          script.onerror = () => reject(new Error('Could not load Google sign-in'));
          document.head.append(script);
        });

        window.google.accounts.id.initialize({
          client_id: googleClientId,
          callback: handleCredentialResponse
        });
        window.google.accounts.id.renderButton(document.getElementById('googleButton'), {
          type: 'standard',
          theme: 'outline',
          size: 'large',
          shape: 'rectangular',
          text: 'signin_with',
          width: 300
        });
        errorMessage.textContent = '';
      } catch (error) {
        errorMessage.textContent = error.message || 'Google sign-in is unavailable.';
      }
    }

    initializeGoogleSignIn();
  </script>
</body>
</html>
