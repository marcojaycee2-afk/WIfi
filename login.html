<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Sign in · NAPBOX ISP Manager</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1220;
      color: #e8edf7;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0, #162647 0, #0b1220 58%);
    }
    .card {
      width: min(100%, 410px);
      padding: 34px;
      border: 1px solid #26324a;
      border-radius: 18px;
      background: #141d31;
      box-shadow: 0 24px 70px #0006;
    }
    .brand { margin: 0 0 8px; color: #60a5fa; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 26px; letter-spacing: -.03em; }
    .intro { margin: 10px 0 26px; color: #8896b0; font-size: 14px; }
    label { display: block; margin: 16px 0 7px; color: #c5d0e4; font-size: 13px; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #334560;
      border-radius: 10px;
      outline: none;
      background: #0f172a;
      color: #e8edf7;
      font: inherit;
    }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px #3b82f633; }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    button:disabled { cursor: wait; opacity: .7; }
    .error { min-height: 20px; margin: 12px 0 0; color: #fca5a5; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <p class="brand">NAPBOX · ISP Manager</p>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to manage your ISP workspace.</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submitButton" type="submit">Sign in</button>
      <p class="error" id="errorMessage" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const button = document.getElementById('submitButton');
    const errorMessage = document.getElementById('errorMessage');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      errorMessage.textContent = '';
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: form.elements.username.value,
            password: form.elements.password.value
          })
        });
        if (response.ok) {
          window.location.replace('/');
          return;
        }
        const result = await response.json();
        errorMessage.textContent = result.error || 'Sign in failed. Please try again.';
      } catch {
        errorMessage.textContent = 'Unable to reach the server. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
